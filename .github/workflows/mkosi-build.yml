name: Verify mkosi reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/mkosi-build.yml'
  push:
    branches: [master]
    paths:
      - 'os/**'
      - '.github/workflows/mkosi-build.yml'

concurrency:
  group: mkosi-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Produced by two cache-disabled local builds of BASELINE_REVISION. The
  # embedded Git revision and SOURCE_DATE_EPOCH are inputs to the artifacts, so
  # these hashes are only meaningful for that exact revision -- the comparison
  # below is skipped on anything else. Refresh all three together.
  BASELINE_REVISION: 2611402ad7cadded2a044777f9542b5ef6579393
  BARE_SHA256: 630921781a37210ddc21104390d1b9c9da5d725541fa48b5c0e9f1e1b1a10af1
  UKI_SHA256: 0b40d5095589235c465dea3dd6c294f00bd90f1c1ccb5cf9fd8c8ff475df85f0

jobs:
  static:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Runs in seconds and covers the whole os/mkosi static contract, so it
      # gates every change rather than waiting for a manual dispatch.
      - name: Check the static contract
        run: ./os/mkosi/build.sh lint

  cross-host:
    name: Compare with local mkosi baseline
    # The full image build takes ~40 minutes, so keep it opt-in.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      # GitHub-hosted runners have enough CPU and memory for this build, but
      # their preinstalled SDKs consume most of the available disk. Remove only
      # those unused SDKs before checkout; the OS build itself remains hermetic.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      # Check out the dispatched ref, not a hardcoded revision. Pinning the
      # baseline here meant the job could never validate the branch it ran on,
      # and the pinned commit becomes unreachable once the branch is squashed
      # or rebased, which would break the job outright.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python for mkosi
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned mkosi
        run: |
          python3 -m venv "$RUNNER_TEMP/mkosi-venv"
          "$RUNNER_TEMP/mkosi-venv/bin/pip" install --disable-pip-version-check \
            'mkosi @ git+https://github.com/systemd/mkosi.git@84af20892b61c8e177e391f997ded8b4cb5514f2'
          echo "$RUNNER_TEMP/mkosi-venv/bin" >> "$GITHUB_PATH"

      - name: Install mkosi host dependencies
        run: |
          mapfile -t dependencies < <(mkosi --directory os/mkosi dependencies)
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${dependencies[@]}"

      - name: Build without component cache
        env:
          # ubuntu-latest currently provides four vCPUs and 16 GiB of RAM.
          # Do not oversubscribe either the CPU or compiler memory.
          JOBS: '4'
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners restrict unprivileged user namespaces.
          # Run mkosi as root instead of weakening the runner's AppArmor policy.
          # Keep setup-python out of the build PATH because Ubuntu's lddtree
          # expects the distro Python and its python3-pyelftools module.
          ci_bin="$RUNNER_TEMP/mkosi-ci-bin"
          mkdir -p "$ci_bin"
          ln -s "$(command -v mkosi)" "$ci_bin/mkosi"
          sudo --set-home env \
            "PATH=$ci_bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "JOBS=$JOBS" \
            ./os/mkosi/build.sh image "$RUNNER_TEMP/mkosi-cross-host"
          sudo chown -R "$USER:$USER" "$RUNNER_TEMP/mkosi-cross-host/out"

      - name: Compare with local byte-for-byte baseline
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mkosi-cross-host/out/prod"
          # Assert the release members exist and parse, rather than dumping
          # them to stdout and checking nothing.
          tar -xOf dstack-0.6.0.tar.gz dstack-0.6.0/sha256sum.txt | grep -q .
          tar -xOf dstack-0.6.0.tar.gz dstack-0.6.0/metadata.json \
            | python3 -c 'import json,sys; json.load(sys.stdin)'
          sha256sum dstack-0.6.0.tar.gz dstack-0.6.0-uki.tar.gz \
            | tee cross-host.sha256
          if [ "$GITHUB_SHA" = "$BASELINE_REVISION" ]; then
            printf '%s  %s\n' "$BARE_SHA256" dstack-0.6.0.tar.gz \
              | sha256sum --check --strict
            printf '%s  %s\n' "$UKI_SHA256" dstack-0.6.0-uki.tar.gz \
              | sha256sum --check --strict
            echo "matched the recorded cross-host baseline"
          else
            echo "::notice::built $GITHUB_SHA, which is not the baseline" \
              "revision $BASELINE_REVISION; the recorded hashes embed that" \
              "revision so only the build itself was verified. Refresh the" \
              "baseline from this run's cross-host.sha256 to re-enable the" \
              "byte-for-byte comparison."
          fi

      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkosi-cross-host-sha256
          path: ${{ runner.temp }}/mkosi-cross-host/out/prod/cross-host.sha256
          retention-days: 30
