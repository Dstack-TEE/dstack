name: VMM UI build

permissions:
  contents: read

# The VMM's web UI and vmm-cli are built and tested here. Not a required
# status check, so a workflow-level filter is safe.
on:
  push:
    branches: [ next, 'release/**' ]
    paths:
      - 'dstack/vmm/ui/**'
      - 'dstack/vmm/src/vmm-cli.py'
      - 'dstack/vmm/src/tests/test_vmm_cli.py'
      - 'dstack/vmm/requirements.txt'
      - '.github/workflows/vmm-ui.yml'
  pull_request:
    branches: [ next, 'release/**', 'feat/**' ]
    paths:
      - 'dstack/vmm/ui/**'
      - 'dstack/vmm/src/vmm-cli.py'
      - 'dstack/vmm/src/tests/test_vmm_cli.py'
      - 'dstack/vmm/requirements.txt'
      - '.github/workflows/vmm-ui.yml'

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v5

    - name: Install Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Build vmm UI
      run: |
        npm ci
        npm run build
      working-directory: dstack/vmm/ui

    - name: Ensure vmm UI build is clean
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "VMM UI build produced uncommitted changes."
          echo "Run: cd dstack/vmm/ui && npm ci && npm run build"
          echo "Then commit the updated build output dstack/vmm/src/console_v1.html"
          git status --porcelain
          exit 1
        fi

    # `--if-present`: the UI test script is not on every branch yet.
    - name: Test vmm UI
      run: npm run test --if-present
      working-directory: dstack/vmm/ui

  vmm-cli:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v5

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Not on every branch yet; the tests there import its packages.
    - name: Install vmm-cli dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
      working-directory: dstack/vmm

    - name: Test vmm-cli
      run: python3 -m unittest -v tests/test_vmm_cli.py
      working-directory: dstack/vmm/src
