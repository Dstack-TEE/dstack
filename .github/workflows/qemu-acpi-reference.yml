name: QEMU ACPI reference image

on:
  workflow_dispatch:
  push:
    branches: [feat/qemu-acpi-generate-dsdt]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish reference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dstack/crates/qemu-acpi/reference/Dockerfile
          push: true
          tags: |
            kvin/dstack-acpi-tables:qemu-11.1
            kvin/dstack-acpi-tables:9de6fdfff3a84103b
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
