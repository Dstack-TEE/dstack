name: Lean proofs

on:
  push:
    branches: [ next, 'release/**' ]
    paths: [ 'formal/**', '.github/workflows/lean.yml' ]
  pull_request:
    branches: [ next, 'release/**', 'feat/**' ]
    paths: [ 'formal/**', '.github/workflows/lean.yml' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v5

    - name: Reject axioms and unchecked code
      run: "! grep -rnE '^\\s*(axiom|unsafe|@\\[implemented_by|@\\[extern)|native_decide' --include='*.lean' formal"

    - uses: leanprover/lean-action@v1
      with:
        lake-package-directory: formal
