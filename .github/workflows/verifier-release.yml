name: Verifier Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version without the verifier-v prefix
        required: true
        type: string
  push:
    tags:
      - 'verifier-v*'
permissions:
  attestations: write
  id-token: write
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Parse and check version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION=$DISPATCH_VERSION
          else
            case "$GITHUB_REF" in
              refs/tags/verifier-v*) VERSION=${GITHUB_REF#refs/tags/verifier-v} ;;
              *) echo "Expected a verifier-v* tag" >&2; exit 1 ;;
            esac
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Version must be a valid Docker tag" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=verifier-v$VERSION" >> "$GITHUB_ENV"

      # Manual runs rebuild an existing release tag, not the selected branch.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && env.RELEASE_TAG || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve the revision to build
        run: echo "GIT_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Release images are built through the same script contributors run by
      # hand, so a published image can be reproduced and checked digest-for-digest.
      # See the builder README for the reproduction recipe.
      - name: Build and push Docker image
        id: build-and-push
        env:
          PUSH: "1"
          METADATA_FILE: ${{ runner.temp }}/build-metadata.json
          GIT_REV: ${{ env.GIT_REV }}
          IMAGE_VERSION: ${{ env.VERSION }}
          IMAGE_NAME: ghcr.io/dstack-tee/dstack-verifier:${{ env.VERSION }}
          LATEST_IMAGE_NAME: ghcr.io/dstack-tee/dstack-verifier:latest
          IMAGE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          DSTACK_SRC_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          dstack/verifier/builder/build-image.sh \
            "$IMAGE_NAME" \
            "$LATEST_IMAGE_NAME"
          digest=$(jq -r '."containerimage.digest"' "$METADATA_FILE")
          if [ -z "$digest" ] || [ "$digest" = null ]; then
            echo "the build did not report an image digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous pull access
        env:
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          token=$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:dstack-tee/dstack-verifier:pull" \
            | jq -er .token)
          curl -fsSL -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/dstack-tee/dstack-verifier/manifests/$IMAGE_DIGEST"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-name: "ghcr.io/dstack-tee/dstack-verifier"
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.GIT_REV }}
          name: "Verifier Release v${{ env.VERSION }}"
          body: |
            ## Docker Image Information

            **Image**: `ghcr.io/dstack-tee/dstack-verifier:${{ env.VERSION }}`

            **Digest (SHA256)**: `${{ steps.build-and-push.outputs.digest }}`

            **Verification**: [Verify on Sigstore](https://search.sigstore.dev/?hash=${{ steps.build-and-push.outputs.digest }})
