name: Verifier Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'verifier-v*'
permissions:
  attestations: write
  id-token: write
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Parse and check version
        run: |
          case "${GITHUB_REF}" in
            refs/tags/verifier-v*) VERSION=${GITHUB_REF#refs/tags/verifier-v} ;;
            *)
              echo "This release workflow must run on a verifier-v* tag; got ${GITHUB_REF}." >&2
              exit 1
              ;;
          esac
          if [ -z "${VERSION}" ]; then
            echo "The release version is empty." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Parsed version: ${VERSION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Git commit timestamps
        run: |
          echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
          echo "GIT_REV=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          context: dstack/verifier
          file: dstack/verifier/builder/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_ORG }}/dstack-verifier:${{ env.VERSION }}
            ${{ vars.DOCKERHUB_ORG }}/dstack-verifier:latest
          platforms: linux/amd64
          provenance: false
          build-contexts: |
            build-shared=dstack/build/shared
          build-args: |
            DSTACK_REV=${{ env.GIT_REV }}
            IMAGE_VERSION=${{ env.VERSION }}
            IMAGE_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            DSTACK_SRC_URL=${{ github.server_url }}/${{ github.repository }}.git
            SOURCE_DATE_EPOCH=${{ env.TIMESTAMP }}
          annotations: |
            manifest:org.opencontainers.image.title=dstack-verifier
            manifest:org.opencontainers.image.description=Remote attestation verification service for dstack
            manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            manifest:org.opencontainers.image.revision=${{ env.GIT_REV }}
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ env.GIT_REV }}/dstack/verifier
            manifest:org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ env.GIT_REV }}/dstack/verifier/README.md
            manifest:org.opencontainers.image.licenses=Apache-2.0
            manifest:org.opencontainers.image.base.name=docker.io/library/debian:bookworm
            manifest:org.opencontainers.image.base.digest=sha256:0d8498a0e9e6a60011df39aab78534cfe940785e7c59d19dfae1eb53ea59babe

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: "docker.io/${{ vars.DOCKERHUB_ORG }}/dstack-verifier"
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Verifier Release v${{ env.VERSION }}"
          body: |
            ## Docker Image Information

            **Image**: `docker.io/${{ vars.DOCKERHUB_ORG }}/dstack-verifier:${{ env.VERSION }}`

            **Digest (SHA256)**: `${{ steps.build-and-push.outputs.digest }}`

            **Verification**: [Verify on Sigstore](https://search.sigstore.dev/?hash=${{ steps.build-and-push.outputs.digest }})
