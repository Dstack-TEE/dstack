version = 1
SPDX-PackageName = "dstack"
SPDX-PackageSupplier = "Phala Network <dstack@phala.network>"
SPDX-PackageDownloadLocation = "https://github.com/Dstack-TEE/dstack"

# Non source files

[[annotations]]
path = [
    "*.md",
    ".agent/**/*.md",
    ".claude/**/*.md",
    "docs/**/*.md",
    "dstack/**/*.md",
    "examples/**/*.md",
    "sdk/**/*.md",
    "tools/**/*.md",
    "os/README.md",
    "os/common/**/*.md",
    "os/image/**/*.md",
]
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "**/requirements.txt"
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "**/package.json",
    "**/openapi.json",
    "**/tsconfig.json",
    "**/tsconfig.node.json",
    "**/tsconfig.browser.json",
    "dstack/kms/auth-eth-bun/.oxlintrc.json",
    "dstack/kms/auth-eth/slither.config.json",
    "**/package-lock.json",
    "dstack/kms/auth-eth/.openzeppelin/unknown-2035.json",
    "dstack/kms/auth-mock/.oxlintrc.json",
    "dstack/kms/auth-simple/.oxlintrc.json",
    "dstack/kms/auth-simple/auth-config.example.json",
    "tools/sca/examples/heartbeat/config.json",
    "tools/sca/examples/hello-c/config.json",
    "tools/sca/examples/heartbeat/rootfs/etc/heartbeat/interval",
    "sdk/simulator/*.json",
    "sdk/go/go.sum",
    "sdk/go/ratls/go.sum",
    "dstack/kms/dstack-app/builder/shared/builder-pinned-packages.txt",
    "dstack/kms/dstack-app/builder/shared/pinned-packages.txt",
    "dstack/gateway/dstack-app/builder/shared/builder-pinned-packages.txt",
    "dstack/gateway/dstack-app/builder/shared/pinned-packages.txt",
]
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "dstack/gateway/templates/wg.conf",
    "dstack/guest-agent/templates/metrics.tpl",
]
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    ".cursorrules",
    ".mailmap",
    ".gitignore",
    "dstack/**/.gitignore",
    "dstack/**/.npmignore",
    "docs/**/.gitignore",
    "examples/**/.gitignore",
    "os/common/**/.gitignore",
    "os/image/**/.gitignore",
    "sdk/**/.gitignore",
    "sdk/**/.npmignore",
    "tools/**/.gitignore",
]
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "os/common/nvidia/**",
    "os/common/rootfs/**",
    "os/common/scripts/**",
]
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "docs/security/dstack-audit.pdf",
    "dstack_Technical_Charter_Final_10-17-2025.pdf",
    "sdk/simulator/quote.hex",
    "sdk/simulator/attestation.bin",
    "dstack/ra-tls/assets/tdx_quote",
    "dstack/cc-eventlog/samples/ccel.bin",
    "dstack/cc-eventlog/samples/tpm_eventlog.bin",
    "dstack/tpm-attest/tests/tpm_quote_sample.bin",
    "dstack/tpm-qvl/certs/gcp-root-ca.pem",
    "dstack/dstack-attest/tests/nitro_attestation.bin",
    "dstack/dstack-attest/tests/nitro_attestation_dbg.bin",
    "dstack/dstack-attest/tests/sev_snp_attestation.bin",
    "dstack/dstack-attest/tests/sev_snp_ask.pem",
    "dstack/dstack-attest/tests/sev_snp_vcek.pem",
    "dstack/nsm-attest/tests/nitro_attestation.bin",
    "dstack/nsm-qvl/tests/nitro_attestation.bin",
    "dstack/nsm-qvl/certs/AWS_NitroEnclaves_Root-G1.pem",
    "dstack/tpm-qvl/certs/AWS_NitroEnclaves_Root-G1.pem",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Backend-neutral OS contract

[[annotations]]
path = "os/spec/*.json"
SPDX-FileCopyrightText = "Copyright (c) 2026 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# dstack-owned OS backend

[[annotations]]
path = "os/yocto/**"
SPDX-FileCopyrightText = "Copyright (c) Hashforest Technology LLC"
SPDX-License-Identifier = "Apache-2.0"

# Experimental Debian/mkosi guest OS backend. Supplies the copyright for the
# formats that cannot carry a header; everything that can now does. It is
# deliberately not precedence = "override", so a patch backported from an
# upstream project keeps that project's license instead of being relabelled
# Apache-2.0.
[[annotations]]
path = "os/mkosi/**"
SPDX-FileCopyrightText = "© 2026 Phala Network <dstack@phala.network>"
SPDX-License-Identifier = "Apache-2.0"

# Legacy cross-component tools kept outside the Yocto backend.

[[annotations]]
path = "tools/vm-runner/**"
SPDX-FileCopyrightText = "Copyright (c) Hashforest Technology LLC"
SPDX-License-Identifier = "Apache-2.0"

# Artworks


[[annotations]]
path = [
    "docs/assets/**",
    "docs/security-guide/assets/**",
    "dstack-logo.svg",
]
SPDX-FileCopyrightText = "Copyright (c) 2024-2025 The Project Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Scripts with SPDX-like content (false positive prevention)

[[annotations]]
path = "tools/add-spdx-attribution.py"
SPDX-FileCopyrightText = "© 2025 Phala Network <dstack@phala.network>"
SPDX-License-Identifier = "Apache-2.0"
precedence = "override"

# Vendor code

[[annotations]]
path = "dstack/kms/auth-eth/lib/openzeppelin-contracts-upgradeable/**"
SPDX-FileCopyrightText = "Copyright (c) 2016-2025 Zeppelin Group Ltd"
SPDX-License-Identifier = "MIT"
precedence = "override"

[[annotations]]
path = "dstack/kms/auth-eth/lib/openzeppelin-foundry-upgrades/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"
precedence = "override"

[[annotations]]
path = "dstack/kms/auth-eth/lib/forge-std/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "Apache-2.0"
precedence = "override"

# ktls 6.0.2 plus rustls/ktls#70; see dstack/vendor/README.md.
[[annotations]]
path = "dstack/vendor/ktls/**"
SPDX-FileCopyrightText = "Copyright (c) 2022 Amos Wenger <amos@bearcove.net>"
SPDX-License-Identifier = "MIT OR Apache-2.0"
precedence = "override"

# Generated files

[[annotations]]
path = "dstack/kms/auth-eth/typechain-types/**"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/*.lock"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/*.lockb"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/*.snap"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/src/generated.rs"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/src/generated/*"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/gateway/assets/*"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/guest-api/src/generated/*"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/dstack-util/tests/fixtures/*"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/verifier/fixtures/*"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/verifier/builder/shared/*.txt"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/guest-agent/fixtures/*"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "dstack/gateway/test-run/e2e/certs/*",
    "dstack/gateway/test-run/e2e/configs/*",
    "dstack/gateway/test-run/e2e/pebble-config.json",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dstack/crates/qemu-acpi/fixtures/*.bin"
