[Journal]
# The guest has no persistent journal, so say so and budget the one it has.
#
# Storage=auto means persistent only if /var/log/journal already exists, and
# nothing creates it: Debian's systemd package ships no /var/log entries
# (verified against systemd 257.13-1~deb13u1 from the pinned snapshot), its
# tmpfiles rule for that directory is `z` -- adjust if present, never create --
# and no dstack recipe makes one. So journald has always written to
# /run/log/journal, where every System* setting below used to be inert and
# RuntimeMaxUse=0 was the only live one. journald reported the result as
# "Runtime Journal (...) is 8.0M, max 0B, 0B free": no budget at all.
#
# The System* settings would not have worked either. /var/log is an overlay
# whose upper layer is the /var/volatile tmpfs, so SystemKeepFree=1G asked for
# more free space than the whole filesystem has on a 2 GB CVM. journald folds
# keep-free into the limit -- MIN(MAX(used + free - keep_free, min_use),
# max_use) -- so the 128M budget collapsed to the 16M floor: "System Journal
# (...) is 8.0M, max 16.0M" on a 1 GiB /var/log, against "max 128.0M" on 8 GiB.
#
# Keeping the journal in /run rather than creating /var/log/journal is
# deliberate. Both are tmpfs and neither survives a reboot, but /var/volatile
# is also where /var/lib/docker's writable layer lives, and the images are what
# fills a small CVM. Every limit here is a size journald can satisfy in /run,
# and RuntimeKeepFree keeps its default 15% of the filesystem, which scales
# with the CVM instead of being a fixed floor larger than it.
Storage=volatile
RuntimeMaxUse=128M
RuntimeMaxFileSize=10M
RuntimeMaxFiles=10
ReadKMsg=no
