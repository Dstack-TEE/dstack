[Unit]
Wants=dstack-guest-agent.service
After=dstack-guest-agent.service
OnFailure=dstack-boot-error@%n.service

[Service]
# The agent restarts itself on crashes; give up once it is parked in `failed`
# or never comes up, so OnFailure= reports the error instead of hanging boot.
# Its sockets come from dstack-guest-agent.socket and exist once it is active.
TimeoutStartSec=300
ExecStartPre=/bin/sh -c 'until systemctl is-active -q dstack-guest-agent.service; do systemctl is-failed -q dstack-guest-agent.service && exit 1; sleep 1; done'
