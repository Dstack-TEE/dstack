# Keep udev from autoloading the NVIDIA driver, so the only things that load it
# are the two services that do so explicitly, after nvidia-module-options has
# written the options the topology needs.
#
# `blacklist` suppresses loading by alias only; an explicit `modprobe nvidia` by
# name still works, which is exactly what nvidia-persistenced.service and
# nvidia-fabricmanager.service do from ExecStartPre.
#
# Without this, systemd's 80-drivers.rules (`ENV{MODALIAS}=="?*",
# RUN{builtin}+="kmod load"`) loads the driver during coldplug in
# systemd-udev-trigger.service, because nvidia.ko carries PCI aliases that match
# every passed-through GPU:
#
#   pci:v000010DEd*sv*sd*bc03sc00i00*   NVIDIA VGA controller
#   pci:v000010DEd*sv*sd*bc03sc02i00*   NVIDIA 3D controller  (H200, B300, ...)
#   pci:v000010DEd*sv*sd*bc06sc80i00*   NVSwitch
#
# nvidia-drm must be listed too. It carries the same three aliases and depends
# on nvidia-modeset, which depends on nvidia -- so blacklisting nvidia alone is
# bypassed: udev matches the alias to nvidia-drm and the dependency chain pulls
# nvidia in anyway. Verified with `modprobe -n -v <modalias>` against the built
# module tree: with only nvidia blacklisted the alias still loads all three.
#
# nvidia-modeset, nvidia-uvm and nvidia-peermem carry no aliases at all, so they
# are only ever loaded explicitly or as dependencies and need no entry.
blacklist nvidia
blacklist nvidia-drm
