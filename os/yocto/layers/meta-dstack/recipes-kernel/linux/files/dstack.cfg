CONFIG_MODULES=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_NET_9P=y
CONFIG_NET_9P_VIRTIO=y
CONFIG_9P_FS=y
CONFIG_9P_FS_POSIX_ACL=y
CONFIG_PCI=y
CONFIG_TUN=m
CONFIG_VIRTIO_PCI=y

# Network NIC drivers. GCP C3/modern instances use gVNIC (the Google gve
# driver); older/virtio instances use virtio-net. Without gve, a C3 CVM gets
# no NIC -> no DHCP -> no network. Build both in.
CONFIG_VIRTIO_NET=y
CONFIG_NET_VENDOR_GOOGLE=y
CONFIG_GVE=y
CONFIG_ISO9660_FS=y
CONFIG_WIREGUARD=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# Enforce per-directory limits on shared ext4 data disks.
CONFIG_QUOTA=y
CONFIG_QFMT_V2=y

# Support filesystem images used to isolate workload storage.
CONFIG_BLK_DEV_LOOP=y

CONFIG_NR_CPUS=512

# BPF
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y

CONFIG_KPROBES=y
#
CONFIG_PM=n
CONFIG_SUSPEND=n
CONFIG_PM_SLEEP=n
CONFIG_HOTPLUG_PCI=n
CONFIG_BT=n
CONFIG_MMC=n
CONFIG_WLAN=n

# dm-verity verifies the rootfs in the initramfs (no modules loaded yet), so the
# rootfs hash algorithm must be built-in. linux-yocto-tiny ships SHA256 as a
# module (=m); force it built-in or early verity fails with
# "verity: Cannot initialize hash function (-ENOENT)".
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y

# Production kernel self-protection baseline.
#
# CONFIG_INIT_ON_FREE_DEFAULT_ON is deliberately NOT set: with init_on_free=1
# a GCP TDX guest is silently killed by the host during mem_encrypt_init()
# (the 1 GiB SWIOTLB private->shared conversion) and reboot-loops before
# reaching /init. Confirmed on c3-standard-4 by booting the same image with
# init_on_alloc=0/init_on_free=0 cmdline overrides: only init_on_free=1
# reproduces the reset; init_on_alloc=1 alone boots fine (and is kept below).
# The same kernel with init_on_free=1 boots fine on AWS EC2 and QEMU TDX,
# so this is a GCP host-side interaction, not a generic kernel bug.
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_IO_STRICT_DEVMEM=y
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_MAGIC_SYSRQ=n
CONFIG_LEGACY_TIOCSTI=n

# Kernel TLS (`tcp_ulp = "tls"`), which dstack-gateway's optional kTLS offload
# installs the negotiated session keys into. Built in rather than a module: the
# yocto image packages modules one by one, so `=m` would need a matching
# kernel-module-tls entry in the image recipe, and a missing one fails at
# runtime rather than at build time. The gateway still treats kTLS as opt-in and
# probes for this ULP at startup, so having it available does not turn it on.
#
# CONFIG_TLS_DEVICE is deliberately left off: it hands session keys to the NIC,
# which a confidential guest has no reason to trust and no CVM NIC supports.
CONFIG_TLS=y

# The record layer kTLS uses. GCM covers the AES suites the gateway negotiates;
# ChaCha20-Poly1305 is here because a client that picks it would otherwise fail
# the handover per connection rather than at configuration time. AES-NI brings
# the accelerated GCM implementations -- on 6.11+ that includes the VAES ones,
# which is the difference between kTLS costing 18% of bulk throughput and
# gaining 20% (measured on Emerald Rapids across kernels 6.1 / 6.12 / 6.17).
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_AES_NI_INTEL=y
CONFIG_CRYPTO_CHACHA20POLY1305=y

# Userspace character device and virtual TPM support.
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_TCG_TPM=y
CONFIG_TCG_VTPM_PROXY=y

# Devices that cannot exist in a CVM. The linux-yocto baseline builds these for
# bare metal, but a dstack guest only ever sees virtio, plus gVNIC on GCP and
# ENA on AWS. Leaving them in means a host that presents the matching PCI IDs
# can steer the guest into driver code no deployment uses. Kept in step with
# os/mkosi/components/kernel/kernel.config so both guest kernels carry the same
# device policy. Passing a ConnectX NIC through later is an addition here --
# CONFIG_MLX5_CORE and the INFINIBAND stack -- not a relaxation of these.
CONFIG_TIGON3=n
CONFIG_E100=n
CONFIG_E1000=n
CONFIG_E1000E=n
CONFIG_SKY2=n
CONFIG_FORCEDETH=n
CONFIG_8139TOO=n
CONFIG_R8169=n
CONFIG_NET_TULIP=n
CONFIG_PCCARD=n
CONFIG_AGP=n
CONFIG_MACINTOSH_DRIVERS=n
CONFIG_NVRAM=n
CONFIG_PROVIDE_OHCI1394_DMA_INIT=n
CONFIG_EARLY_PRINTK_DBGP=n
CONFIG_NETCONSOLE=n


# CONFIG_SCSI, CONFIG_INPUT and CONFIG_HOTPLUG_CPU are deliberately absent even
# though the mkosi guest kernel turns all three off. KERNEL_FEATURES for the
# dstack machine pulls in features/scsi/disk.scc, and the machine's own feature
# set brings the other two, so a =n here loses the merge and the built kernel
# has them enabled regardless. Asserting them was worse than not asserting
# them: the three lines were the only reason this whole file could not be
# checked, which left the other seventy assertions unverified as well.
#
# Whether the yocto image can actually drop SCSI -- the mkosi one does, so the
# two guest kernels differ here -- needs a boot test on GCP and AWS, where the
# root disk may be virtio-scsi rather than virtio-blk. That belongs in its own
# change.
