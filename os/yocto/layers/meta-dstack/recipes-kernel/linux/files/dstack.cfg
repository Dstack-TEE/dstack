CONFIG_MODULES=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_NET_9P=y
CONFIG_NET_9P_VIRTIO=y
CONFIG_9P_FS=y
CONFIG_9P_FS_POSIX_ACL=y
CONFIG_PCI=y
CONFIG_TUN=m
CONFIG_VIRTIO_PCI=y

# Network NIC drivers. GCP C3/modern instances use gVNIC (the Google gve
# driver); older/virtio instances use virtio-net. Without gve, a C3 CVM gets
# no NIC -> no DHCP -> no network. Build both in.
CONFIG_VIRTIO_NET=y
CONFIG_NET_VENDOR_GOOGLE=y
CONFIG_GVE=y
CONFIG_ISO9660_FS=y
CONFIG_WIREGUARD=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# Enforce per-directory limits on shared ext4 data disks.
CONFIG_QUOTA=y
CONFIG_QFMT_V2=y

# Support filesystem images used to isolate workload storage.
CONFIG_BLK_DEV_LOOP=y

CONFIG_NR_CPUS=512

# BPF
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y

CONFIG_KPROBES=y
#
CONFIG_PM=n
CONFIG_SUSPEND=n
CONFIG_PM_SLEEP=n
CONFIG_HOTPLUG_CPU=n
CONFIG_HOTPLUG_PCI=n
CONFIG_BT=n
CONFIG_MMC=n
CONFIG_SCSI=n
CONFIG_INPUT=n
CONFIG_WLAN=n

# dm-verity verifies the rootfs in the initramfs (no modules loaded yet), so the
# rootfs hash algorithm must be built-in. linux-yocto-tiny ships SHA256 as a
# module (=m); force it built-in or early verity fails with
# "verity: Cannot initialize hash function (-ENOENT)".
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y

# Production kernel self-protection baseline.
#
# CONFIG_INIT_ON_FREE_DEFAULT_ON is deliberately NOT set: with init_on_free=1
# a GCP TDX guest is silently killed by the host during mem_encrypt_init()
# (the 1 GiB SWIOTLB private->shared conversion) and reboot-loops before
# reaching /init. Confirmed on c3-standard-4 by booting the same image with
# init_on_alloc=0/init_on_free=0 cmdline overrides: only init_on_free=1
# reproduces the reset; init_on_alloc=1 alone boots fine (and is kept below).
# The same kernel with init_on_free=1 boots fine on AWS EC2 and QEMU TDX,
# so this is a GCP host-side interaction, not a generic kernel bug.
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_IO_STRICT_DEVMEM=y
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_MAGIC_SYSRQ=n
CONFIG_LEGACY_TIOCSTI=n
