CONFIG_BRIDGE=m
CONFIG_BRIDGE_NETFILTER=m
CONFIG_NETFILTER_XT_MATCH_IPVS=m

# nf_tables support (needed by modern iptables-nft backend)
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_NETDEV=y
CONFIG_NFT_COMPAT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_REDIR=m
CONFIG_NFT_CT=m
CONFIG_NFT_LOG=m
CONFIG_NFT_LIMIT=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_REJECT_INET=m
CONFIG_NFT_HASH=m
CONFIG_BPF_SYSCALL=y
CONFIG_IP_VS=m
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
# SELinux. This line alone never took effect: the kernel is built from the
# linux-yocto "tiny" type, which leaves CONFIG_SECURITY off, and SELINUX is
# "depends on SECURITY_NETWORK && AUDIT && NET && INET" with SECURITY_NETWORK in
# turn depending on SECURITY. So every image this fragment produced ran without
# SELinux while claiming otherwise, and os/mkosi -- which starts from
# x86_64_defconfig -- had it.
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_AUDIT=y
CONFIG_SECURITY_SELINUX=y
# Compiling it in is still not enough, and the second failure is silent too: an
# LSM only registers if CONFIG_LSM names it, and that string's default is picked
# by DEFAULT_SECURITY_*. Enabling SECURITY without naming a default lands on
# DEFAULT_SECURITY_DAC, whose list is
# "landlock,lockdown,yama,loadpin,safesetid,ipe,bpf" -- no selinux -- so the
# hooks would build and never initialize.
CONFIG_DEFAULT_SECURITY_SELINUX=y
# The resulting order is asserted rather than left to a default, in both
# backends, so neither a defconfig change nor a new DEFAULT_SECURITY_* branch
# can drop selinux without failing the build. Entries for LSMs that are not
# compiled in are ignored by the kernel.
CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,selinux,smack,tomoyo,apparmor,ipe,bpf"
CONFIG_VLAN_8021Q=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_XFRM=y
CONFIG_XFRM_USER=y
CONFIG_XFRM_ALGO=y
# Disable ESP transforms to mitigate DirtyFrag-style page-cache writes via esp4/esp6.
# Keep XFRM userspace support available for non-ESP networking features, but do
# not build the vulnerable ESP protocol handlers.
CONFIG_INET_ESP=n
CONFIG_INET6_ESP=n
CONFIG_XFRM_ESP=n

# RxRPC is not needed by dstack and is another DirtyFrag trigger path. Keep it
# disabled even if future kernel feature sets would otherwise enable it.
CONFIG_AF_RXRPC=n
CONFIG_RXKAD=n
# Capped at =m by NETFILTER_XTABLES=m; =y was never produced.
CONFIG_NETFILTER_XT_MATCH_BPF=m
CONFIG_CRYPTO_SEQIV=y
CONFIG_IPVLAN=m
CONFIG_BTRFS_FS=m
CONFIG_BTRFS_FS_POSIX_ACL=y
CONFIG_CFS_BANDWIDTH=y
# ebtables is "depends on BRIDGE", and BRIDGE is a module above, so a tristate
# cannot exceed it: =y was silently downgraded to =m by the merge and the
# fragment asserted a value the build never produced. os/mkosi corrected the
# same line in 48db713c8; Yocto only warns on an unachievable kconf value, so
# it survived here.
CONFIG_BRIDGE_NF_EBTABLES=m
CONFIG_NETFILTER_FAMILY_BRIDGE=y
CONFIG_VETH=y
# Capped at =m by NETFILTER_XTABLES=m; =y was never produced.
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_VXLAN=y
CONFIG_CGROUP_BPF=y

# ipset support (required by kube-router network policy controller)
CONFIG_IP_SET=m
CONFIG_IP_SET_HASH_IP=m
CONFIG_IP_SET_HASH_NET=m
CONFIG_IP_SET_HASH_IPPORT=m
CONFIG_IP_SET_HASH_IPPORTIP=m
CONFIG_IP_SET_HASH_IPPORTNET=m
CONFIG_IP_SET_HASH_NETPORT=m
CONFIG_IP_SET_HASH_NETIFACE=m
CONFIG_IP_SET_BITMAP_IP=m
CONFIG_IP_SET_BITMAP_PORT=m
CONFIG_IP_SET_LIST_SET=m
CONFIG_NETFILTER_XT_SET=m
CONFIG_NETFILTER_XT_MATCH_PHYSDEV=m

# Managed-bridge networking for nested container managers (Incus and friends).
#
# The image programs netfilter through the nftables frontend (see the
# iptables_%.bbappend that enables libnftnl), so Docker's rules land in
# nftables and a container manager that picks its firewall driver by probing
# which ruleset is in use gets the nftables one. This block and its counterpart
# in os/mkosi/components/kernel/kernel.config are deliberately identical:
# bridge filtering is the capability the two backends silently disagreed on.
#
# The bridge family is where per-instance bridge filters are rendered.
CONFIG_NF_TABLES_BRIDGE=m
CONFIG_NFT_BRIDGE_META=m
CONFIG_NFT_BRIDGE_REJECT=m

# ebtables matches, reached through nft_compat when ebtables-nft cannot express
# a match natively. BRIDGE_NF_EBTABLES above builds the matches, targets and
# watchers; the legacy ebt tables (BRIDGE_NF_EBTABLES_LEGACY, BRIDGE_EBT_T_*)
# are deliberately absent, because the bridge family above is the filtering
# path and nothing on the nftables frontend uses those tables.
CONFIG_BRIDGE_EBT_ARP=m
CONFIG_BRIDGE_EBT_IP=m
CONFIG_BRIDGE_EBT_IP6=m
CONFIG_BRIDGE_EBT_AMONG=m
CONFIG_BRIDGE_EBT_LIMIT=m
CONFIG_BRIDGE_EBT_VLAN=m

# The DHCP path of a managed bridge appends a CHECKSUM target so dnsmasq's
# replies reach guests with checksum-offloading virtio NICs. Reached through
# NFT_COMPAT, which is how the nftables frontend programs an xtables target.
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=m

# IPv6 packet filtering. The nftables frontend synthesises the tables it is
# asked for, so ip6tables needs none of these; they are here because this tree
# keeps NETFILTER_XTABLES_LEGACY on (from features/netfilter/netfilter.scc) and
# ships the legacy frontends alongside the nft ones. IPv4 legacy tables are
# fully present, so IPv6 being the one family missing was an inconsistency
# regardless of which frontend is the default: ip6tables-legacy could not even
# list a table.
CONFIG_IP6_NF_IPTABLES=m
CONFIG_IP6_NF_FILTER=m
CONFIG_IP6_NF_MANGLE=m
CONFIG_IP6_NF_NAT=m

# BLK IO throttling support
CONFIG_BLK_CGROUP=y
CONFIG_BLK_DEV_THROTTLING=y
# CONFIG_BLK_DEV_THROTTLING_LOW was removed upstream and no longer exists, so
# the line it replaced could never be satisfied.

# Traffic control for the per-instance bandwidth limits of nested container
# managers (Incus `limits.max`, #1176). Incus caps a bridged NIC with an HTB
# root qdisc and class on egress and, on ingress, an ingress qdisc carrying a
# u32 filter with a police action. NET_SCHED and NET_CLS_ACT provide none of
# the four: each is its own tristate, and a missing one surfaces only at
# runtime, as "Specified qdisc kind is unknown" for a limit the manager had
# already accepted. Built in rather than modules for the same reason as
# CONFIG_TLS: no kernel-module-* package to forget on the Yocto side, and no
# reliance on module autoload from inside the manager's own namespaces. This
# block and its counterpart in the other backend are deliberately identical.
CONFIG_NET_SCHED=y
CONFIG_NET_CLS_ACT=y
CONFIG_NET_SCH_HTB=y
CONFIG_NET_SCH_INGRESS=y
CONFIG_NET_CLS_U32=y
CONFIG_NET_ACT_POLICE=y

# Checkpoint/restore support (#1180). What LXC needs from it is PR_SET_MM_MAP:
# that is how the container monitor rewrites its own title to
# "[lxc monitor] <path> <name>", and Incus's seccomp notification handler
# resolves a monitor PID to its instance by that title. Without the symbol the
# prctl returns EINVAL, the monitor keeps its "incusd forkstart" command line,
# the lookup fails ("Failed to find container for monitor <pid>") and every
# intercepted syscall (security.syscalls.intercept.*) is resumed unhandled
# instead of getting the container-aware answer. Everything the symbol gates
# needs CAP_CHECKPOINT_RESTORE or CAP_SYS_ADMIN (PR_SET_MM, ns_last_pid, the
# IPC *_next_id sysctls, PTRACE_O_SUSPEND_SECCOMP, seccomp filter dumps of a
# ptraced task), and it is what every general-purpose distro kernel ships;
# none of it faces the host. The Yocto 6.18 build already had it, from the
# cfg/lxc.scc and cfg/criu.scc that meta-virtualization adds; the 6.9 kernel
# of 0.5.9 and x86_64_defconfig do not. Asserted here so neither backend can
# lose it.
CONFIG_CHECKPOINT_RESTORE=y
