[Content]
# swtpm mirrors meta-dstack's dstack-tee-simulator RDEPENDS: the simulator
# spawns swtpm to back the vTPM it exposes, so without it the dev image has no
# TPM. openssl and tpm2-tools, the other two runtime deps, already arrive via
# ca-certificates and the base package list.
Packages=
        gdb
        openssh-server
        strace
        swtpm
        tcpdump
        vim

[Build]
Environment=DSTACK_BUILD_FLAVOR=dev
