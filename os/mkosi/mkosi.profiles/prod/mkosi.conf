[Content]
RemoveFiles=
        /usr/include
        /usr/share/OVMF
        /usr/share/ovmf
        /usr/share/doc
        /usr/share/info
        /usr/share/locale
        /usr/share/man
        /usr/**/*.a
        /usr/**/*.la
        /var/cache/debconf
        /var/lib/dbus/machine-id
        /var/lib/dpkg
        /var/lib/ucf
        /var/log/*
        # Mirror of meta-dstack's disable_login() (dstack-rootfs-base.inc).
        #
        # The base skeleton masks getty@, serial-getty@ and debug-shell with
        # /dev/null symlinks, but those masks live in /etc, which
        # dstack-prepare.sh covers with a writable tmpfs overlay at runtime.
        # In the production image the login stack must be structurally absent
        # from the verity-measured rootfs, not merely disabled by mutable
        # state: the serial port is a chardev owned by the untrusted host.
        #
        # systemd-getty-generator matters most here. It reads the console from
        # the kernel command line, which is console=ttyS0, so it instantiates
        # serial-getty@ttyS0 on every boot regardless of presets.
        /usr/lib/systemd/system-generators/systemd-getty-generator
        /usr/lib/systemd/system/getty@.service
        /usr/lib/systemd/system/serial-getty@.service
        /usr/lib/systemd/system/console-getty.service
        /usr/lib/systemd/system/container-getty@.service
        /usr/lib/systemd/system/autovt@.service
        /usr/lib/systemd/system/getty.target
        /usr/lib/systemd/system/getty-pre.target
        /usr/lib/systemd/system/getty.target.wants
        /usr/lib/systemd/system/debug-shell.service
        /usr/bin/login
        /usr/bin/loginctl
        /usr/sbin/agetty
        /usr/sbin/getty
        /usr/bin/systemd-tty-ask-password-agent
        /usr/lib/systemd/systemd-logind
        /usr/lib/systemd/system/systemd-logind.service
        /usr/lib/systemd/system/multi-user.target.wants/systemd-logind.service
        /usr/lib/systemd/logind.conf.d
        # Suspend/hibernate units: the kernel drops CONFIG_PM entirely, so
        # these can only produce failed jobs.
        /usr/lib/systemd/system/suspend.target
        /usr/lib/systemd/system/systemd-hibernate.service
        /usr/lib/systemd/system/systemd-suspend-then-hibernate.service
        /usr/share/consolefonts
        /usr/share/keymaps
        /usr/share/polkit-1
        /usr/share/factory

[Build]
Environment=DSTACK_BUILD_FLAVOR=prod
