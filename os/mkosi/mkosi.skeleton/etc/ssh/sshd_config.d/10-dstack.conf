# Mirrors meta-dstack's disable-password-auth.conf. PermitEmptyPasswords and
# PubkeyAuthentication match sshd's compiled defaults today, but this drop-in
# is the image's only ssh policy, so state them rather than inherit them from
# upstream defaults and Debian's shipped sshd_config.

# Disable all password-based authentication
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no

# Only allow public key authentication
PubkeyAuthentication yes
PermitRootLogin prohibit-password
