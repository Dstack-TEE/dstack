# SPDX-License-Identifier: Apache-2.0
[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Snapshot=20260721T000000Z
Repositories=main,contrib,non-free-firmware

[Output]
# Format=none would return before install_build_dest, extra trees, postinst,
# tmpfiles, presets, depmod and the finalize scripts, so the tar format is what
# keeps the full mkosi lifecycle enabled. Its output is not part of the release
# and mkosi.postoutput discards it once assemble.sh has produced the real
# artifacts, so it is left uncompressed and given a name of its own: sharing
# the release name made mkosi track the release tarball as one of its outputs,
# which `mkosi clean` and `--force` are entitled to delete.
Format=tar
# ImageId/ImageVersion must precede Output: %i and %v are expanded in file
# order, so declaring Output first silently yields "--rootfs.tar".
# ImageVersion is checked against DSTACK_VERSION by tests/acceptance.sh.
ImageId=dstack
ImageVersion=0.6.0-rc0
Output=%i-%v-rootfs
CompressOutput=no
# Must stay empty. The default is [uki, kernel, initrd], and the kernel split
# is produced even with Bootable=no: it copies the kernel out of the rootfs and
# drops a <output>.vmlinuz beside the release artifacts.
SplitArtifacts=

[Content]
Bootable=no
Hostname=dstack
Packages=
        systemd
        systemd-boot
        systemd-resolved
        dbus
        ca-certificates
        bash
        coreutils
        iproute2
        iptables
        nftables
        docker.io
        docker-cli
        docker-compose
        containerd
        chrony
        wireguard-tools
        cryptsetup
        dmsetup
        tpm2-tools
        curl
        wget
        iputils-ping
        dnsutils
        traceroute
        netcat-openbsd
        fdisk
        dosfstools
        pciutils
        usbutils
        cpio
        jq
        fuse3
        pigz
        rsync
        xfsprogs
        e2fsprogs
        gdisk
        parted
        busybox-static
        cryptsetup-bin
        systemd-boot-efi
        acpid
        numactl
RemoveFiles=
        /var/lib/containerd/.dstack-keep
        /var/lib/docker/.dstack-keep
        /var/lib/tpm2-tss/system/keystore/.dstack-keep
        /var/mail/.dstack-keep
        /var/volatile/.dstack-keep
# No KernelCommandLine= here on purpose. mkosi only consumes it on bootable
# paths (UKI build, bootloader entries, the vm/qemu verbs), all unreachable
# with Bootable=no, so the value it used to carry was dead config that
# contradicted the command line actually measured into the UKI. The real one
# is built in scripts/make-release-artifacts.sh and matches Yocto's
# UKI_CMDLINE_BASE.
CleanPackageMetadata=yes
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
BuildPackages=
        gcc
        g++
        binutils
        make
        cmake
        ninja-build
        pkg-config
        autoconf
        automake
        libtool
        gettext
        bc
        bison
        flex
        dwarves
        nasm
        acpica-tools
        uuid-dev
        libssl-dev
        libelf-dev
        libtirpc-dev
        libcurl4-openssl-dev
        libxml2-dev
        libxmlsec1-dev
        zlib1g-dev
        libudev-dev
        libaio-dev
        libattr1-dev
        libblkid-dev
        libseccomp-dev
        libcap-dev
        rpcsvc-proto
        git
        curl
        ca-certificates
        patch
        xz-utils
        bzip2
        zstd
        tar
        file
        perl
        python3
        gawk
        kmod
        coreutils
        findutils

[Build]
WithNetwork=yes
BuildSources=../..:dstack
# Keeps build scripts from mutating the checked-out worktree. Note that this
# applies to every BuildSources entry, so no source mount can hold state that
# has to survive the build; the dev component cache uses BuildDirectory=.
BuildSourcesEphemeral=yes
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# Image assembly needs mkosi's general-purpose tools plus the explicit list
# below, not virtualization runtimes or foreign distribution package managers.
ToolsTreeProfiles=misc
ToolsTreeRepositories=main
ToolsTreePackages=
        cpio
        cryptsetup-bin
        dosfstools
        gdisk
        gzip
        jq
        mtools
        pax-utils
        squashfs-tools
        systemd-ukify
        tar
History=no
