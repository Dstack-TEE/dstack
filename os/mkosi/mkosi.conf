# SPDX-License-Identifier: Apache-2.0
[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Snapshot=20260721T000000Z
Repositories=main,contrib,non-free-firmware

[Output]
Format=tar
# The native tar output is deliberately replaced by the Yocto-compatible tar
# in mkosi.postoutput. This keeps the complete mkosi lifecycle enabled without
# leaving an unrelated rootfs image beside the release artifacts.
Output=dstack-0.6.0
CompressOutput=gz
SplitArtifacts=
ImageId=dstack
ImageVersion=0.6.0

[Content]
Bootable=no
Bootloader=none
Hostname=dstack
Packages=
        systemd
        systemd-boot
        systemd-resolved
        dbus
        ca-certificates
        bash
        coreutils
        iproute2
        iptables
        nftables
        docker.io
        docker-cli
        docker-compose
        containerd
        chrony
        wireguard-tools
        cryptsetup
        dmsetup
        tpm2-tools
        curl
        jq
        fuse3
        pigz
        xfsprogs
        e2fsprogs
        gdisk
        parted
        busybox-static
        cryptsetup-bin
        systemd-boot-efi
        acpid
        numactl
SkeletonTrees=mkosi.skeleton
PostInstallationScripts=mkosi.postinst
KernelCommandLine=console=ttyS0,115200n8 console=tty0 panic=30 coherent_pool=64M
CleanPackageMetadata=yes
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
BuildPackages=
        gcc
        g++
        binutils
        make
        cmake
        ninja-build
        pkg-config
        autoconf
        automake
        libtool
        gettext
        bc
        bison
        flex
        dwarves
        nasm
        acpica-tools
        uuid-dev
        libssl-dev
        libelf-dev
        libtirpc-dev
        libcurl4-openssl-dev
        libxml2-dev
        libxmlsec1-dev
        zlib1g-dev
        libudev-dev
        libaio-dev
        libattr1-dev
        libblkid-dev
        libseccomp-dev
        libcap-dev
        rpcsvc-proto
        git
        curl
        ca-certificates
        patch
        xz-utils
        bzip2
        zstd
        tar
        file
        perl
        python3
        gawk
        kmod
        coreutils
        findutils

[Build]
WithNetwork=yes
BuildSources=../..:dstack
BuildSourcesEphemeral=yes
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# Image assembly needs mkosi's general-purpose tools plus the explicit list
# below, not virtualization runtimes or foreign distribution package managers.
ToolsTreeProfiles=misc
ToolsTreeRepositories=main
ToolsTreePackages=
        cpio
        cryptsetup-bin
        dosfstools
        gdisk
        gzip
        jq
        mtools
        pax-utils
        squashfs-tools
        systemd-ukify
        tar
History=no

[Validation]
SecureBoot=no
