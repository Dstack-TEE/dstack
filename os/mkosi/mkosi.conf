# SPDX-License-Identifier: Apache-2.0
[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Snapshot=20260721T000000Z
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
Output=dstack-mkosi.raw
CompressOutput=no
ImageId=dstack
ImageVersion=0.1

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=dstack
Packages=
        systemd
        systemd-boot
        systemd-resolved
        dbus
        ca-certificates
        bash
        coreutils
        iproute2
        iptables
        nftables
        docker.io
        docker-cli
        docker-compose
        containerd
        chrony
        wireguard-tools
        cryptsetup
        dmsetup
        tpm2-tools
        curl
        jq
        fuse3
        pigz
        xfsprogs
        e2fsprogs
        gdisk
        parted
        busybox-static
        cryptsetup-bin
        systemd-boot-efi
        acpid
        numactl
SkeletonTrees=mkosi.skeleton
PostInstallationScripts=mkosi.postinst
KernelCommandLine=console=ttyS0,115200n8 console=tty0 panic=30 coherent_pool=64M

[Validation]
SecureBoot=no
