[workspace]
members = [".", "types", "no_std_check"]
resolver = "2"

[workspace.dependencies]
anyhow = { version = "1.0.97", default-features = false }
bon = { version = "3.4.0", default-features = false }
borsh = { version = "1.5.7", default-features = false, features = ["derive"] }
hex = { version = "0.4.3", default-features = false }
pkcs8 = { version = "0.10", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.8", default-features = false }
dcap-qvl = "0.3.10"
ed25519-dalek = { version = "2.1.1", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
sha3 = { version = "0.10.8", default-features = false }
tokio = { version = "1.46.1" }
alloy = { version = "1.0.32", default-features = false }
http = "1.3.1"
x509-parser = "0.16.0"
dstack-sdk-types = { path = "types", version = "0.1.3", default-features = false }

[package]
name = "dstack-sdk"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "This crate provides a rust client for communicating with dstack"
authors = ["Encifher <encifher@rizelabs.io>"]

[dependencies]
alloy = { workspace = true, features = ["signers", "signer-local"] }
anyhow.workspace = true
dstack-sdk-types = { workspace = true, default-features = true }
bon.workspace = true
ed25519-dalek.workspace = true
k256.workspace = true
sha3.workspace = true
hex = { workspace = true, features = ["std"] }
http.workspace = true
http-client-unix-domain-socket = "0.1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
x509-parser.workspace = true

[dev-dependencies]
dcap-qvl.workspace = true
tokio = { workspace = true, features = ["full"] }
