              "content-type": "application/json",
              "X-Dstack-Control-Token": controlToken(),
            },
            body: JSON.stringify(payload),
          });
          const value = await response.json();
          if (!response.ok || value.error) throw new Error(value.error || response.statusText);
          state.control = value;
          setMessage(action === "start" ? "queue started" : "stop requested");
          await pollState();
        } catch (error) {
          setMessage(`control error: ${error}`, true);
        } finally {
          syncControlSelection();
        }
      }

      function bindControlPanel() {
        const config = loadControlConfig();
        $("controlPrompt").value = config.prompt || "";
        $("investigateFailures").checked = !!config.investigate;
        $("overwriteResults").checked = !!config.overwrite;
        $("startSelected").addEventListener("click", () =>
          controlAction("start", {
            case_ids: [...state.selected],
            prompt: $("controlPrompt").value,
            investigate_failures: $("investigateFailures").checked,
            overwrite: $("overwriteResults").checked,
          }),
        );
        $("stopCurrent").addEventListener("click", () => controlAction("stop"));
        $("openControlConfig").addEventListener("click", () => { renderPlanExecutionSettings(); $("controlConfigModal").hidden = false; });
        $("controlConfigClose").addEventListener("click", () => { saveControlConfig(); $("controlConfigModal").hidden = true; });
        $("controlConfigModal").addEventListener("click", (event) => {
          if (event.target === $("controlConfigModal")) { saveControlConfig(); $("controlConfigModal").hidden = true; }
        });
        ["controlPrompt", "investigateFailures", "overwriteResults"].forEach((id) => {
          $(id).addEventListener("input", saveControlConfig);
          $(id).addEventListener("change", saveControlConfig);
        });
        $("selectAll").addEventListener("click", () => toggleCaseSelection(() => true));
        $("selectFail").addEventListener("click", () => toggleCaseSelection((status) => status === "FAIL"));
        $("selectPass").addEventListener("click", () => toggleCaseSelection((status) => status === "PASS"));
        $("selectPending").addEventListener("click", () => toggleCaseSelection((status) => status === "PENDING"));
        if (!controlToken()) {
          $("controlDockMsg").textContent = "control token missing from URL";
          $("controlDockMsg").classList.add("error");
        }
        syncControlSelection();
      }

      function toggleCaseSelection(predicate) {
        const rows = [...document.querySelectorAll(".case-row")].filter((row) => predicate(row.dataset.status));
        const clear = !!rows.length && rows.every((row) => state.selected.has(row.dataset.id));
        rows.forEach((row) => {
          row.querySelector(".case-select").checked = !clear;
          if (clear) state.selected.delete(row.dataset.id);
          else state.selected.add(row.dataset.id);
        });
        syncControlSelection();
      }

      function overviewStatsHTML(counts) {
        const total = STATUS_ORDER.reduce((n, k) => n + (counts[k] || 0), 0);
        const pass = counts.PASS || 0;
        const done = ["PASS", "FAIL", "BLOCKED", "NOT_RUN", "SKIPPED"].reduce(
          (n, k) => n + (counts[k] || 0),
          0,
        );
        const rate = done ? Math.round((pass / done) * 100) + "%" : "—";
        const card = (k, v, sub, cls) =>
          `<div class="card"><div class="k">${k}</div><div class="v${cls ? " " + cls : ""}">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
        const legend = STATUS_ORDER.filter((k) => counts[k])
          .map(
            (k) =>
              `<span><span class="dot bg-${k}"></span>${k.toLowerCase()} <b>${counts[k]}</b></span>`,
          )
          .join("");
        const bar = STATUS_ORDER.filter((k) => counts[k])
          .map(
            (k) =>
              `<i class="bg-${k}" style="width:${(((counts[k] || 0) / (total || 1)) * 100).toFixed(2)}%"></i>`,
          )
          .join("");
        return (
          `<div class="cards">` +
          card("Total cases", total) +
          card("Pass rate", rate, pass + " of " + done + " finished", "st-PASS") +
          card("Failed", counts.FAIL || 0, "", "st-FAIL") +
          card("Running", counts.RUNNING || 0, "", "st-RUNNING") +
          card("Pending", counts.PENDING || 0, "", "st-PENDING") +
          `</div>` +
          `<div class="dist"><div class="bar">${bar}</div><div class="legend">${legend}</div></div>`
        );
      }

      function renderOverview(s) {
        const control = (s && s.control) || state.control || { enabled: false };
        state.control = control;
        const rebuild =
          state.view !== "overview" ||
          !$("ovStats");
        state.view = "overview";
        state.currentCase = null;
        // The overview owns the plan-level conversation. Case output belongs
        // only to the case page, even while that case is currently running.
        const logAgent = "orchestrator";
        const logLabel = "Plan orchestrator output";
        setActiveRow(null);
        $("orchCard").classList.add("active");
        const counts = (s && s.counts) || state.counts;
        if (rebuild) {
          $("main").innerHTML =
            `<div class="page">` +
            `<div class="breadcrumbs">overview</div>` +
            `<div class="case-head"><h2>Run overview</h2></div>` +
            `<div id="ovStats">${overviewStatsHTML(counts)}</div>` +
            logPanelHTML(logLabel, !!control.running) +
            `</div>`;
          bindLogPanel();
          switchAgent(logAgent, logLabel);
        } else {
          $("ovStats").innerHTML = overviewStatsHTML(counts);
          const cs = $("controlState");
          if (cs)
            cs.textContent = control.current_case
              ? `running ${control.current_case}`
              : control.queue && control.queue.length
                ? `${control.queue.length} queued`
                : "idle";
          syncControlSelection();
          if (state.agent !== logAgent) switchAgent(logAgent, logLabel);
        }
      }

      function resultPanelHTML(c) {
        const result = c.result || {
          status: "PENDING",
          summary: "No test result has been recorded yet.",
          steps: [],
        };
        const steps = (result.steps || [])
          .map(
            (step) =>
              `<div class="step-result ${esc(step.status)}" id="result-${esc(step.id)}"><div><b class="st-${esc(step.status)}">${esc(step.status)}</b> <span class="sid">${esc(step.id)}</span></div><div>${esc(step.observed)}</div></div>`,
          )
          .join("");
        const commands = (c.evidence || [])
          .filter((item) => ["command", "stdout", "stderr"].includes(item.kind))
          .map(
            (item) =>
              `<details class="evidence-item" data-open-key="evidence:${esc(item.sequence || item.session_line || item.output_sha256 || item.summary || "unknown")}"><summary><span class="st-${item.kind === "stderr" || (item.exit_code && item.exit_code !== 0) ? "FAIL" : "PASS"}">${esc(item.kind || "evidence")}</span> <a href="#result-${esc(item.step_id || "unassigned")}">${esc(item.step_id || "unassigned")}</a> · ${esc(item.summary || "output")}</summary><div class="evidence-description"><b>Proves:</b> ${esc(item.description || "Command and output captured as execution evidence.")}</div><pre>${esc((item.command || "") + (item.output_excerpt ? (item.command ? "\n\n--- output excerpt ---\n" : "") + item.output_excerpt : ""))}</pre><small>session line ${esc(item.session_line || "?")} · output sha256 ${esc(item.output_sha256 || "")}</small></details>`,
          )
          .join("");
        const attachments = (c.evidence || [])
          .filter((item) => item.kind === "attachment")
          .map((item) => {
            const url = `/api/attachment?run=${encodeURIComponent(state.runId)}&case=${encodeURIComponent(c.id)}&path=${encodeURIComponent(item.path)}`;
            const image = String(item.media_type || "").startsWith("image/")
              ? `<img src="${url}" alt="${esc(item.summary || item.path)}" loading="lazy" />`
              : "";
            return `<div class="attachment"><a href="${url}" target="_blank" rel="noopener">${esc(item.summary || item.path)}</a><div><small><a href="#result-${esc(item.step_id || "unassigned")}">${esc(item.step_id || "unassigned")}</a> · ${esc(item.media_type || "file")} · ${fmtBytes(item.bytes || 0)} · sha256 ${esc(item.sha256 || "")}</small></div><div class="evidence-description"><b>Proves:</b> ${esc(item.description || "Attachment captured as case evidence.")}</div>${image}</div>`;
          })
          .join("");
        const commandCount = (c.evidence || []).filter((item) => ["command", "stdout", "stderr"].includes(item.kind)).length;
        const attachmentCount = (c.evidence || []).filter((item) => item.kind === "attachment").length;
        const fixture = c.fixture;
        const fixturePanel = fixture
          ? `<details class="report-section" data-panel="fixture"><summary>Fixture <small>${esc((fixture.manifest || {}).profile || "fixture")} · ${esc((fixture.lease || {}).state || "unknown")}</small></summary><div class="report-section-body"><pre>${esc(JSON.stringify(fixture, null, 2))}</pre></div></details>`
          : "";
        return (
          fixturePanel +
          `<details class="report-section" data-panel="result" open><summary>Test result <span class="badge-lg st-${esc(result.status)}">${esc(result.status)}</span></summary>` +
          `<div class="report-section-body"><p>${esc(result.summary)}</p>${steps}</div></details>` +
          `<details class="report-section" data-panel="evidence"><summary>Evidence <small>${commandCount} command/output record${commandCount === 1 ? "" : "s"}</small></summary>` +
          `<div class="report-section-body">${commands ? `<div class="evidence-list">${commands}</div>` : `<div class="empty-state">No evidence recorded.</div>`}</div></details>` +
          `<details class="report-section" data-panel="attachments"><summary>Attachments <small>${attachmentCount} file${attachmentCount === 1 ? "" : "s"}</small></summary>` +
          `<div class="report-section-body">${attachments ? `<div class="attachments">${attachments}</div>` : `<div class="empty-state">No attachments recorded.</div>`}</div></details>`
        );
      }

      function caseResultSignature(c) {
        return JSON.stringify([c.result || null, c.evidence || [], c.fixture || null]);
      }

      function caseMetadataHTML(c) {
        const m = c.metadata || {};
        const executor = m.executor || {};
        const rows = [
          ["Executor", executor.type === "script" ? `script · ${executor.entrypoint || "entrypoint"}` : `agent · ${executor.agent || executor.type || "default"}${executor.model ? " · " + executor.model : ""}`],
          ["Fixture", m.fixture_profile || "none"],
        ];
        return `<table class="meta-table"><tbody>${rows.map(([key, value]) => `<tr><th>${esc(key)}</th><td>${esc(value)}</td></tr>`).join("")}</tbody></table>`;
      }

      function closeSpecModal() {
        $("specModal").hidden = true;
      }

      function bindSpecModal(c) {
        const button = $("openSpec");
        if (!button) return;
        button.addEventListener("click", () => {
          $("specModalTitle").textContent = `${c.id} · ${c.title}`;
          $("specModalBody").innerHTML = c.html;
          $("specModal").hidden = false;
          $("specModalClose").focus();
        });
      }

      async function openCase(id) {
        state.view = "case";
        state.currentCase = id;
        state.caseResultSignature = "";
        state.navIndex = state.nav.indexOf(id);
        highlightNav(false);
        setActiveRow(id);
        revealCase(id);
        $("orchCard").classList.remove("active");
        $("main").innerHTML = `<div class="page"><div class="empty-state">Loading ${esc(id)}…</div></div>`;
        try {
          const c = await (
            await fetch("/api/case?run=" + encodeURIComponent(state.runId) + "&id=" + encodeURIComponent(id))
          ).json();
          if (c.error) throw new Error(c.error);
          const row = document.querySelector(
            `.case-row[data-id="${CSS.escape(id)}"]`,
          );
          const status = row ? row.dataset.status : "PENDING";
          $("main").innerHTML =
            `<div class="page">` +
            `<div class="case-top-actions"><button class="action-btn" id="openSpec">case specification</button></div>` +
            `<div class="breadcrumbs"><a id="crumbHome">overview</a> / ${esc(c.chapter)} / ${esc(c.section)} / ${esc(c.id)}</div>` +
            `<div class="case-head"><h2>${esc(c.title)}</h2><span class="badge-lg st-${status}" id="caseBadge">${status}</span></div>` +
            caseMetadataHTML(c) +
            logPanelHTML(c.id + " output", status === "RUNNING") +
            `<div id="caseResults">${resultPanelHTML(c)}</div>` +
            `</div>`;
          state.caseResultSignature = caseResultSignature(c);
          $("crumbHome").addEventListener("click", () => renderOverview());
          bindSpecModal(c);
          bindLogPanel();
          switchAgent("case:" + id, id + " output");
        } catch (e) {
          $("main").innerHTML = `<div class="page"><div class="empty-state"><div class="big">Failed to load case</div>${esc(e)}</div></div>`;
        }
      }

      async function refreshCaseResults() {
        if (state.view !== "case" || !state.currentCase || state.caseRefreshPending || !$("caseResults")) return;
        state.caseRefreshPending = true;
        try {
          const response = await fetch("/api/case?run=" + encodeURIComponent(state.runId) + "&id=" + encodeURIComponent(state.currentCase));
          const c = await response.json();
          if (!response.ok || c.error || state.view !== "case" || c.id !== state.currentCase) return;
          const signature = caseResultSignature(c);
          if (signature === state.caseResultSignature) return;
          const openDetails = new Set(
            [...$("caseResults").querySelectorAll("details[open]")]
              .map((details) => details.dataset.openKey || (details.dataset.panel ? `panel:${details.dataset.panel}` : ""))
              .filter(Boolean),
          );
          $("caseResults").innerHTML = resultPanelHTML(c);
          $("caseResults").querySelectorAll("details").forEach((details) => {
            const key = details.dataset.openKey || (details.dataset.panel ? `panel:${details.dataset.panel}` : "");
            details.open = !!key && openDetails.has(key);
          });
          state.caseResultSignature = signature;
        } catch { /* next state poll retries */ }
        finally { state.caseRefreshPending = false; }
      }

      /* Keep the open case's badge in sync with live status */
      function syncCaseBadge() {
        if (state.view !== "case") return;
        const badge = $("caseBadge");
        const active = document.querySelector(".case-row.active");
        if (badge && active && badge.textContent !== active.dataset.status) {
          badge.textContent = active.dataset.status;
          badge.className = "badge-lg st-" + active.dataset.status;
        }
      }

      /* ---------- Polling ---------- */
      let lastState = null;
      async function pollState() {
        try {
          const s = await (await fetch("/api/state?run=" + encodeURIComponent(state.runId))).json();
          if (!state.runId) state.runId = s.run_id;
          lastState = s;
          state.control = s.control || { enabled: false };
          setConn(true);
          renderHeader(s);
          renderFilters();
          if (!state.treeBuilt) {
            buildTree(s.chapters);
            updateGroupBars();
            applyFilter();
          } else {
            updateStatuses(s.cases);
          }
          syncControlSelection();
          if (state.view === "overview") renderOverview(s);
          syncCaseBadge();
          if (state.view === "case") refreshCaseResults();
        } catch {
          setConn(false);
          if (!state.treeBuilt) $("meta").textContent = "connection failed — retrying…";
        }
      }

      /* ---------- Sidebar resize ---------- */
      (function initResizer() {
        const rz = $("resizer");
        const sb = $("sidebar");
        rz.addEventListener("pointerdown", (e) => {
          rz.classList.add("drag");
          rz.setPointerCapture(e.pointerId);
          const move = (ev) => {
            const w = Math.min(560, Math.max(220, ev.clientX));
            sb.style.width = w + "px";
          };
          const up = () => {
            rz.classList.remove("drag");
            rz.removeEventListener("pointermove", move);
            rz.removeEventListener("pointerup", up);
          };
          rz.addEventListener("pointermove", move);
          rz.addEventListener("pointerup", up);
        });
      })();

      /* ---------- Search & shortcuts ---------- */
      let searchTimer = 0;
      $("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.filterText = e.target.value;
          state.navIndex = state.nav.length ? 0 : -1;
          applyFilter();
        }, 120);
      });
      $("search").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && state.nav.length) {
          e.preventDefault();
          openCase(state.nav[Math.max(0, state.navIndex)]);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          navMove(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          navMove(-1);
        } else if (e.key === "Escape") {
          e.target.blur();
        }
      });
      document.addEventListener("keydown", (e) => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
        if (typing) return;
        if (e.key === "/") {
          e.preventDefault();
          $("search").focus();
        } else if (e.key === "j" || e.key === "ArrowDown") {
          e.preventDefault();
          navMove(1);
        } else if (e.key === "k" || e.key === "ArrowUp") {
          e.preventDefault();
          navMove(-1);
        } else if (e.key === "Enter" && state.navIndex >= 0) {
          openCase(state.nav[state.navIndex]);
        } else if (e.key === "f") {
          state.follow = !state.follow;
          const b = $("btnFollow");
          if (b) b.classList.toggle("on", state.follow);
        } else if (e.key === "m") {
          if ($("btnRaw"))
            setLogMode(state.logMode === "raw" ? "rendered" : "raw");
        } else if (e.key === "Escape") {
          if (!$("controlConfigModal").hidden) { saveControlConfig(); $("controlConfigModal").hidden = true; }
          else if (!$("specModal").hidden) closeSpecModal();
          else renderOverview(lastState);
        }
      });

      $("orchCard").addEventListener("click", () => renderOverview(lastState));
      $("jumpRunning").addEventListener("click", () => {
        const row = document.querySelector('.case-row[data-status="RUNNING"]');
        if (row) openCase(row.dataset.id);
      });
      $("specModalClose").addEventListener("click", closeSpecModal);
      $("specModal").addEventListener("click", (event) => {
        if (event.target === $("specModal")) closeSpecModal();
      });

      async function loadRuns() {
        const response = await fetch("/api/runs");
        const value = await response.json();
        state.runs = value.runs || [];
        if (!state.runs.some((run) => run.id === state.runId)) {
          state.runId = (state.runs.find((run) => run.active) || state.runs[0] || {}).id || "";
        }
        $("runPicker").innerHTML = state.runs
          .map((run) => `<option value="${esc(run.id)}">${esc(run.id)}</option>`)
          .join("");
        $("runPicker").value = state.runId;
      }

      $("runPicker").addEventListener("change", async (event) => {
        state.runId = event.target.value;
        const url = new URL(location.href);
        url.searchParams.set("run", state.runId);
        history.replaceState(null, "", url);
        state.treeBuilt = false;
        state.selected.clear();
        state.currentCase = null;
        state.caseResultSignature = "";
        state.agent = "orchestrator";
        state.offset = 0;
        state.rawText = "";
        $("tree").innerHTML = "";
        lastState = null;
        renderOverview(null);
        await pollState();
      });

      /* ---------- Boot ---------- */
      bindControlPanel();
      renderOverview(null);
      loadRuns().then(pollState).catch(() => pollState());
      setInterval(() => {
        if (!document.hidden) pollState();
      }, 1000);
      setInterval(() => {
        if (!document.hidden) pollLog();
      }, 500);
      setInterval(() => {
        if (!document.hidden) loadRuns().catch(() => {});
      }, 5000);
    </script>
  </body>
</html>
