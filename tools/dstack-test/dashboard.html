<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>dstack test</title><style>
:root{color-scheme:dark;font:14px system-ui;background:#0b1020;color:#dce5ff}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;background:#121a30;border-bottom:1px solid #273453}h1{margin:0;font-size:20px}.meta{color:#91a4cc;margin-top:4px}.grid{display:grid;grid-template-columns:minmax(340px,29vw) 1fr;height:calc(100vh - 73px)}aside{padding:14px;border-right:1px solid #273453;overflow:auto}main{padding:20px 28px;overflow:auto}.summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.summary span{background:#1a2540;padding:5px 8px;border-radius:12px}.orchestrator,.case{display:block;width:100%;text-align:left;background:#151e35;color:inherit;border:1px solid #293858;border-radius:7px;padding:9px;margin:6px 0;cursor:pointer}.case:hover,.orchestrator:hover,.active{border-color:#6da7ff;background:#192642}.badge{float:right;border-radius:10px;padding:2px 7px;font-size:11px}.PASS{background:#126b47}.FAIL{background:#8b2733}.SKIPPED,.BLOCKED,.NOT_RUN{background:#74551b}.RUNNING{background:#215a91}.PENDING{background:#39445d}details.tree{border:1px solid #253250;border-radius:8px;margin:8px 0;background:#10182b}details.tree>summary{cursor:pointer;font-weight:650;padding:10px 12px;list-style:none}details.tree>summary::-webkit-details-marker{display:none}details.tree>summary:before{content:'›';display:inline-block;width:18px;color:#83adf5;font-size:18px}details.tree[open]>summary:before{transform:rotate(90deg)}details.section{margin:0 8px 8px;border-left:1px solid #304263}details.section>summary{cursor:pointer;padding:7px 9px;color:#b9c9e9}.case-list{padding:0 7px 4px 18px}.case small{color:#aebddd}.breadcrumbs{color:#91a4cc;margin-bottom:5px}.case-title{font-size:23px;margin:0 0 18px}.spec{max-width:1000px;line-height:1.55}.spec h1{display:none}.spec h2{margin-top:28px;border-bottom:1px solid #2b3959;padding-bottom:6px}.spec h3{margin-top:22px;color:#bdd3ff}.spec pre,.spec code{background:#070b14;border-radius:5px}.spec pre{padding:13px;overflow:auto}.spec code{padding:2px 5px}.spec a{color:#7fb2ff}.agent-panel{margin-top:30px;border:1px solid #273453;border-radius:8px}.agent-panel summary{cursor:pointer;padding:12px;font-weight:650}.toolbar{display:flex;gap:10px;align-items:center;padding:0 12px 10px}.toolbar button{background:#263755;border:0;border-radius:5px;padding:6px 9px;color:inherit;cursor:pointer}#log{white-space:pre-wrap;word-break:break-word;background:#070b14;border-top:1px solid #273453;padding:14px;min-height:180px;max-height:55vh;overflow:auto;margin:0}.empty{color:#91a4cc;padding:50px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:1fr;height:auto}aside{max-height:50vh;border-right:0;border-bottom:1px solid #273453}main{padding:18px}}
</style></head><body><header><h1 id="title">dstack test</h1><div class="meta" id="meta">Connecting…</div></header><div class="grid"><aside><div class="summary" id="summary"></div><button class="orchestrator" onclick="pickAgent('orchestrator','Plan orchestrator')">Plan orchestrator <span id="orchestratorBadge" class="badge PENDING">PENDING</span></button><div id="tree"></div></aside><main id="content"><div class="empty">Select a test case to view its complete specification and steps.</div><details class="agent-panel" open><summary id="agent">Plan orchestrator output</summary><div class="toolbar"><button onclick="resetLog()">Reload history</button><label><input id="follow" type="checkbox" checked> follow</label></div><pre id="log"></pre></details></main></div><script>
let selected='orchestrator',selectedCase='',offset=0,treeBuilt=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pickAgent(id,label){selected=id;offset=0;document.querySelector('#log').textContent='';document.querySelector('#agent').textContent=label+' output';pollLog()}
function resetLog(){offset=0;document.querySelector('#log').textContent='';pollLog()}
async function pickCase(id){selectedCase=id;pickAgent('case:'+id,id);document.querySelectorAll('.case').forEach(x=>x.classList.toggle('active',x.dataset.id===id));try{const c=await(await fetch('/api/case?id='+encodeURIComponent(id))).json();content.innerHTML=`<div class="breadcrumbs">${esc(c.chapter)} / ${esc(c.section)} / ${esc(c.id)}</div><h2 class="case-title">${esc(c.title)}</h2><article class="spec">${c.html}</article><details class="agent-panel"><summary id="agent">${esc(c.id)} output</summary><div class="toolbar"><button onclick="resetLog()">Reload history</button><label><input id="follow" type="checkbox" checked> follow</label></div><pre id="log"></pre></details>`;pollLog()}catch(e){content.innerHTML=`<div class="empty">${esc(e)}</div>`}}
function caseButton(c){return `<button data-id="${esc(c.id)}" class="case" onclick="pickCase('${esc(c.id)}')">${esc(c.id)}<span class="badge ${c.status}">${c.status}</span><br><small>${esc(c.title)}</small></button>`}
function buildTree(chapters){tree.innerHTML=chapters.map(ch=>`<details class="tree"><summary>${esc(ch.title)}</summary>${ch.sections.map(sec=>`<details class="section"><summary>${esc(sec.title)} <small>(${sec.cases.length})</small></summary><div class="case-list">${sec.cases.map(caseButton).join('')}</div></details>`).join('')}</details>`).join('');treeBuilt=true}
function updateStatuses(s){for(const c of s.cases){const b=document.querySelector(`.case[data-id="${CSS.escape(c.id)}"] .badge`);if(b){b.className='badge '+c.status;b.textContent=c.status}}}
async function pollState(){try{const s=await(await fetch('/api/state')).json();title.textContent=s.title;meta.textContent=`run ${s.run_id} · ${s.run_status}`;summary.innerHTML=Object.entries(s.counts).filter(x=>x[1]).map(x=>`<span>${esc(x[0])} ${x[1]}</span>`).join('');orchestratorBadge.className='badge '+s.orchestrator_status;orchestratorBadge.textContent=s.orchestrator_status;if(!treeBuilt)buildTree(s.chapters);else updateStatuses(s)}catch(e){meta.textContent=e}}
async function pollLog(){const log=document.querySelector('#log');if(!log)return;try{const r=await(await fetch(`/api/log?agent=${encodeURIComponent(selected)}&offset=${offset}`)).json();if(r.reset){offset=0;log.textContent=''}if(r.text){log.textContent+=r.text;offset=r.next_offset;const follow=document.querySelector('#follow');if(follow&&follow.checked)log.scrollTop=log.scrollHeight}}catch(e){}}
setInterval(pollState,1000);setInterval(pollLog,500);pollState();pollLog();</script></body></html>
