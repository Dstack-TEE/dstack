syntax = "proto3";

import "google/protobuf/empty.proto";

package dstack_guest;

// For backwards compatibility with tappd
service Tappd {
  // Derives a cryptographic key from the specified key path.
  // Returns the derived key along with its certificate chain.
  rpc DeriveKey(DeriveKeyArgs) returns (GetTlsKeyResponse) {}

  // Derives a new ECDSA key with k256 EC curve.
  rpc DeriveK256Key(GetKeyArgs) returns (DeriveK256KeyResponse) {}

  // Generates a TDX quote
  rpc TdxQuote(TdxQuoteArgs) returns (TdxQuoteResponse) {}

  // Generates a TDX quote with raw report data.
  // This is a low-level API that should be used with caution.
  // When using quotes in multiple locations within your application,
  // ensure proper quote differentiation by including a content type
  // identifier in the report_data to avoid Quote Repurposing Attacks.
  rpc RawQuote(RawQuoteArgs) returns (TdxQuoteResponse) {}

  // Get app info
  rpc Info(google.protobuf.Empty) returns (AppInfo) {}

  // Get the guest agent version
  rpc Version(google.protobuf.Empty) returns (WorkerVersion) {}
}

// The service for the dstack guest agent
service DstackGuest {
  // Derives a cryptographic key from the specified key path.
  // Returns the derived key along with its TLS certificate chain.
  rpc GetTlsKey(GetTlsKeyArgs) returns (GetTlsKeyResponse) {}

  // Derives a new key.
  rpc GetKey(GetKeyArgs) returns (GetKeyResponse) {}

  // Generates a TDX quote with given report data.
  //
  // Answers wherever the platform has Intel TDX; anywhere else it fails, and
  // Attest is the replacement. On GCP Confidential VMs it answers with the TDX
  // quote alone, leaving out the vTPM quote GCP's verification also binds --
  // use Attest there to get evidence a verifier can check in full.
  rpc GetQuote(RawQuoteArgs) returns (GetQuoteResponse) {}

  // Generates a versioned attestation with the given report data.
  // Returns a dstack-defined attestation format that supports different attestation modes across platforms.
  rpc Attest(RawQuoteArgs) returns (AttestResponse) {}

  // Get app info
  rpc Info(google.protobuf.Empty) returns (AppInfo) {}

  // Get GPU information collected during boot.
  rpc GpuInfo(google.protobuf.Empty) returns (GpuInfoResponse) {}

  // Run NVIDIA GPU attestation now, against a nonce the caller chooses.
  //
  // This answers "is the device I can talk to right now a genuine, CC-enabled
  // NVIDIA GPU that signs my challenge", which `GpuInfo` cannot: that returns a
  // record written at boot. Use it after anything that may have reinitialised
  // the GPU -- a driver reload leaves a device that responds to NVML but can no
  // longer attest -- and before submitting work you care about.
  //
  // It is NOT a remote attestation claim, and a relying party outside this CVM
  // must not treat it as one. See `AttestGpuResponse.evidence`.
  rpc AttestGpu(AttestGpuArgs) returns (AttestGpuResponse) {}

  // Sign a payload
  rpc Sign(SignRequest) returns (SignResponse) {}

  // Removed in v0.6.0: `rpc Verify(VerifyRequest) returns (VerifyResponse)`.
  // Signature verification needs no key material and no attestation, and the
  // agent's answer arrives over the socket unattested, so a caller gained
  // nothing over checking the signature itself. The SDKs now do it locally --
  // see `verify_signature` / `verify_signature_chain`. Do not reuse the name.

  // Get the guest agent version
  rpc Version(google.protobuf.Empty) returns (WorkerVersion) {}
}

// The request to derive a key
message GetTlsKeyArgs {
  // Subject of the certificate to request
  string subject = 1;
  // DNS alternative names for the certificate
  repeated string alt_names = 2;
  // Includes quote in the certificate
  bool usage_ra_tls = 3;
  // Key usage server auth
  bool usage_server_auth = 4;
  // Key usage client auth
  bool usage_client_auth = 5;
  // Certificate validity start time as seconds since UNIX epoch
  optional uint64 not_before = 6;
  // Certificate validity end time as seconds since UNIX epoch
  optional uint64 not_after = 7;
  // Includes app info in the certificate
  bool with_app_info = 8;
}

// The request to derive a key
message DeriveKeyArgs {
  // Path used to derive the private key
  string path = 1;
  // Bellow fields are used to generate the certificate
  // Subject of the certificate to request
  string subject = 2;
  // DNS alternative names for the certificate
  repeated string alt_names = 3;
  // Includes quote in the certificate
  bool usage_ra_tls = 4;
  // Key usage server auth
  bool usage_server_auth = 5;
  // Key usage client auth
  bool usage_client_auth = 6;
  // Derive from random seed
  bool random_seed = 7;
}

// The response to a DeriveKey request
message GetTlsKeyResponse {
  // Derived key
  string key = 1;
  // Certificate chain
  repeated string certificate_chain = 2;
}

// The request to derive a new key
message GetKeyArgs {
  // Path to the key to derive
  string path = 1;
  // Purpose of the key
  string purpose = 2;
  // Algorithm of the key. Either `secp256k1` or `ed25519`. Defaults to `secp256k1`
  string algorithm = 3;
}

// The response to a DeriveK256Key request
message DeriveK256KeyResponse {
  // Derived k256 key
  bytes k256_key = 1;
  // Derived k256 signature chain
  repeated bytes k256_signature_chain = 2;
}

// The response to a GetEthKey request
message GetKeyResponse {
  // Derived key
  bytes key = 1;
  // The signature chain consists of the following signatures:
  // [0] - the k256 signature of the derived pK signed by the app root key
  // [1] - the k256 signature of the app root pK signed by the KMS root key
  repeated bytes signature_chain = 2;
}

// The request to get a TDX quote
// The report data is prefixed with `app-data:` before hashing unless the algorithm is `raw`.
// Final report data is hash(`app-data:` + report_data) if the algorithm is not `raw`.
message TdxQuoteArgs {
  // Report data
  bytes report_data = 1;
  // The hash algorithm to use to process the report data. Default is `sha512`.
  // Supported algorithms are:
  // - `sha256`
  // - `sha384`
  // - `sha512`
  // - `sha3-256`
  // - `sha3-384`
  // - `sha3-512`
  // - `keccak256`
  // - `keccak384`
  // - `keccak512`
  // - `raw`: Passes the report_data directly to the driver without any processing
  string hash_algorithm = 2;

  // Custom prefix to prepend to report data before hashing.
  // Defaults to 'app-data:' when hash_algorithm is not 'raw'.
  string prefix = 3;
}

// The request to get a raw TDX quote
message RawQuoteArgs {
  // 64 bytes of report data
  bytes report_data = 1;
}

message TdxQuoteResponse {
  // TDX quote
  bytes quote = 1;
  // Event log
  string event_log = 2;

  // The following fields might be used for app debugging purposes
  // Hash algorithm used to hash the caller passed in report data
  string hash_algorithm = 3;
  // Prefix added to the report data before hashing
  string prefix = 4;
}

message AttestResponse {
  // The attestation
  bytes attestation = 1;
}

message AttestGpuArgs {
  // Exactly 32 bytes of caller-chosen challenge, passed to the GPU verbatim.
  //
  // SPDM fixes the evidence nonce at 32 bytes, and dstack applies no transform
  // so a caller can compare these bytes directly against the `eat_nonce` claim
  // rather than reversing a hash. To bind a longer challenge, hash it yourself.
  bytes nonce = 1;
}

message AttestGpuResponse {
  // Complete JSON output produced by nvattest, in the same shape `GpuInfo`
  // returns, for the nonce in the request.
  //
  // dstack has already checked that nvattest succeeded and that every claim
  // answers this nonce. Appraising the claims -- device count, CC state, VBIOS
  // and driver versions, your own policy -- is the caller's job.
  //
  // To a caller inside this CVM this is a live, meaningful result: the agent ran
  // NVIDIA's verifier, which checked the GPU's report signature, its certificate
  // chain and OCSP status, and the driver and VBIOS RIM signatures, all against
  // this nonce.
  //
  // It is NOT independently verifiable by a third party, for two separate
  // reasons, and the first is the one that surprises people:
  //
  // 1. It is unsigned. `nvattest --verifier local` returns the verifier's
  //    conclusion, not the GPU's signed report. The detached EAT it embeds is
  //    `alg:none` with an empty signature, issued by `NVAT-LOCAL-VERIFIER`, and
  //    claims such as `x-nvidia-gpu-attestation-report-signature-verified` are
  //    assertions about a check already performed, not proof anyone can redo.
  //    The GPU's signed SPDM report and certificate chain are consumed during
  //    verification and do not appear here. So a relying party handed this JSON
  //    has nothing to check -- it is a self-report from inside the CVM.
  // 2. Even signed, it would bind the device and the nonce but not the TD the
  //    device is attached to, so it can be relayed from a genuine remote GPU.
  //    Deriving the nonce from a TDX quote does not help; the relay can derive
  //    it too. Only TDISP/TEE-IO device binding closes that, and no current
  //    Hopper/Blackwell deployment offers it.
  //
  // Remote evidence therefore stays with the boot-time `gpu-attestation` runtime
  // event. Its trust does not come from the JSON being self-authenticating
  // either -- it comes from measured dstack code (pinned by `os_image_hash`)
  // having done the appraisal before any workload existed, with sha256 of the
  // exact bytes measured into RTMR3 and covered by the quote.
  string evidence = 1;
  // The nonce the GPU actually answered, hex-encoded, as it appears in
  // `eat_nonce`. Echoed so a caller can assert on it without re-encoding.
  string nonce = 2;
}

message GpuInfoResponse {
  // Complete JSON output produced by nvattest. Empty when no boot-time GPU
  // attestation output is available.
  string attestation = 1;
}

message GetQuoteResponse {
  reserved 5;
  reserved "attestation";

  // TDX quote
  bytes quote = 1;
  // Event log. V2 runtime events always include their hex-encoded digest
  // preimage. Clients should verify sha384(hex_decode(preimage)) == digest.
  string event_log = 2;
  // Report data
  bytes report_data = 3;
  // Hw config
  string vm_config = 4;
}

// The request to derive a key
message AppInfo {
  // App ID
  bytes app_id = 1;
  // App Instance ID
  bytes instance_id = 2;
  // App certificate
  string app_cert = 3;
  // TCB info
  string tcb_info = 4;
  // App name
  string app_name = 5;
  // Device ID
  bytes device_id = 8;
  // MR Aggregated
  bytes mr_aggregated = 9;
  // OS Image hash
  bytes os_image_hash = 10;
  // Key provider info
  string key_provider_info = 12;
  // Compose hash
  bytes compose_hash = 13;
  // VM config
  string vm_config = 14;
  // Cloud provider sys_vendor (e.g. "Google")
  string cloud_vendor = 15;
  // Cloud provider product_name (e.g. "Google Compute Engine")
  string cloud_product = 16;
}

// The response to a Version request
message WorkerVersion {
  // dstack version
  string version = 1;
  // Git revision
  string rev = 2;
}

// One container that is not reporting healthy.
message ContainerHealth {
  // Container name, without the leading slash Docker prepends.
  string name = 1;
  // Docker health state: "starting" or "unhealthy". A healthy container is
  // never listed. A string rather than an enum so it stays readable as JSON.
  string status = 2;
}

// Aggregate application health, as the agent last determined it.
message HealthResponse {
  // False when the app's own health file says so or has gone stale, or -- when
  // no health file was declared -- when any container that declares a Compose
  // `healthcheck` is not running and healthy.
  bool healthy = 1;
  // The containers that made `healthy` false, so an operator reading gateway
  // logs can tell which one is holding the instance out of rotation. Purely
  // diagnostic -- the gateway routes on `healthy` alone.
  repeated ContainerHealth unhealthy = 2;
  // Set when the agent could not see the app at all for several refreshes in
  // a row (container runtime unreachable, permission denied). `healthy` is
  // false in that case: an agent that cannot see the app is in no position to
  // vouch for it.
  //
  // Reported in the response rather than as an RPC error on purpose. prpc
  // answers both "no such method" and "the handler failed" with HTTP 400 and
  // drops the message, so an error here would be indistinguishable from an
  // agent too old to know this method at all.
  string error = 3;
}

service Worker {
  // Get app info
  rpc Info(google.protobuf.Empty) returns (AppInfo) {}
  // Get the guest agent version
  rpc Version(google.protobuf.Empty) returns (WorkerVersion) {}
  // Attest a key the app derived.
  //
  // Replaces GetAttestationForAppKey, which returned a GetQuoteResponse and so
  // could not answer on a platform without Intel TDX. Returns what
  // DstackGuest.Attest returns; that method cannot serve this case, because it
  // takes the report data from the caller and an external verifier does not
  // know the app key's public key until the agent derives it.
  rpc AttestAppKey(AttestAppKeyRequest) returns (AttestResponse) {}
  // Report whether the app is serving. Polled by the gateway to decide whether
  // this instance should be in its app's load-balancing rotation.
  //
  // Answers from a cache the agent refreshes on its own timer, so the cost of
  // one call is a lock and a clone however many gateway nodes are polling.
  //
  // Only instances that asked for gating (`RegisterCvmRequest.health_check`)
  // are ever polled. That flag, not this method's absence, is what protects an
  // older image: the gateway counts *any* failed poll as unhealthy, so probing
  // to discover support would blackhole every guest agent that predates this.
  rpc Health(google.protobuf.Empty) returns (HealthResponse) {}
}

message SignRequest {
  string algorithm = 1;
  bytes data = 2;
}

message SignResponse {
  // the signature of the data
  bytes signature = 1;
  // The signature chain consists of the following signatures:
  // [0] - the signature of the data
  // [1] - the k256 signature of the message signing pubkey signed by the app root key
  // [2] - the k256 signature of the app root pubkey signed by the KMS root key
  repeated bytes signature_chain = 2;
  // The public key signing the data
  bytes public_key = 3;
}

message AttestAppKeyRequest {
  string algorithm = 1;
}
