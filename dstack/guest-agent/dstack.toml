[default]
workers = 8
max_blocking = 64
ident = "dstack guest agent"
temp_dir = "/tmp"
keep_alive = 10
log_level = "debug"

[default.core]
keys_file = "/dstack/.host-shared/.appkeys.json"
compose_file = "/dstack/.host-shared/app-compose.json"
sys_config_file = "/dstack/.host-shared/.sys-config.json"
data_disks = ["/"]
# Maximum time in seconds to wait for an attestation slot (positive integer).
# The 15-second default accommodates roughly 15 queued one-second TDX quotes.
# Requests that exceed this wait receive HTTP 503 and can retry.
attest_queue_timeout_secs = 15


[internal-v0]
address = "unix:/var/run/dstack/tappd.sock"
reuse = true

[internal]
address = "unix:/var/run/dstack/dstack.sock"
reuse = true

[external]
address = "0.0.0.0"
port = 8090

[guest-api]
address = "vsock:0xffffffff"
port = 8000
