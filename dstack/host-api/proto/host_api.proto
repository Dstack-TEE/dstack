syntax = "proto3";

import "google/protobuf/empty.proto";

package host_api;

message HostInfo {
  string name = 1;
  string version = 2;
}

message Notification {
  string event = 1;
  string payload = 2;
}

message GetSealingKeyRequest {
  bytes quote = 1;
}

message GetSealingKeyResponse {
  bytes encrypted_key = 1;
  bytes provider_quote = 2;
}

// The env the guest re-encrypted to the current KMS root epoch at boot; empty
// when it needed no change.
message SealedEnv {
  bytes sealed_env = 1;
}

service HostApi {
  rpc Info(google.protobuf.Empty) returns (HostInfo);
  rpc Notify(Notification) returns (google.protobuf.Empty);
  rpc GetSealingKey(GetSealingKeyRequest) returns (GetSealingKeyResponse);
  // Replace this VM's stored encrypted env. Accepted once per boot, before
  // application code runs, and only if the stored env is the one it booted with.
  rpc UpdateSealedEnv(SealedEnv) returns (google.protobuf.Empty);
}
