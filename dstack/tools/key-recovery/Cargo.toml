[package]
name = "dstack-key-recovery"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Recover dstack application keys from an older KMS root epoch"

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap.workspace = true
ed25519-dalek.workspace = true
fs-err.workspace = true
hex.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
semver = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

cert-client.workspace = true
dstack-attest.workspace = true
dstack-kms-rpc.workspace = true
dstack-types.workspace = true
ra-tls = { workspace = true, features = ["quote"] }
