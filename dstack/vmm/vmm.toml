workers = 8
max_blocking = 64
ident = "dstack VMM"
temp_dir = "/tmp"
keep_alive = 10
log_level = "debug"
address = "unix:./vmm.sock"
reuse = true
kms_url = "http://127.0.0.1:8081"
event_buffer_size = 20
node_name = ""

[image]
# Path to guest image directory (default: ~/.dstack-vmm/image)
# path = ""
# OCI image registry for guest images (e.g., "dstacktee/guest-image")
registry = ""

[cvm]
# TEE platform: "auto", "tdx", or "amd-sev-snp". Auto selects AMD SEV-SNP when host CPU flags include sev_snp, otherwise TDX.
platform = "auto"
qemu_path = ""
kms_urls = ["http://127.0.0.1:8081"]
shuffle_kms_urls = true
gateway_urls = ["http://127.0.0.1:8082"]
shuffle_gateway_urls = true
# PCCS URL used by guest to verify the quote from local key provider
pccs_url = ""
# Optional dstack GPU attestation proxy. When configured, guests use its
# persistent NVIDIA OCSP and RIM caches during local GPU verification.
# nvidia_attestation_proxy_url = "http://10.0.2.1:8090"
docker_registry = ""
# Directory of attachable volume images (e.g. pre-baked verity volumes). A
# deploy may only attach files under this directory, by bare file name. Empty
# disables volume attachment.
volumes_dir = ""
cid_start = 1000
cid_pool_size = 1000
max_allocable_vcpu = 20
max_allocable_memory_in_mb = 100_000 # MB
# Enable QMP socket
qmp_socket = false
# The user to run the VM as. If empty, the VM will be run as the current user.
# Unique namespace when multiple dstack-vmm instances share one host. When
# empty, a stable value is derived from run_path.
instance_id = ""
# Network choices that deployment RPC callers may make. Macvtap is excluded
# by default because libvirt nwfilter applies only to bridge interfaces.
allowed_network_modes = ["user", "bridge"]
# Empty allowlists mean callers can only use the node networking defaults.
allowed_bridges = []
allowed_macvtap_parents = []
# Largest virtio-net queue pair count a deployment request may ask for. With
# vhost on, queue pairs otherwise default to the VM's vCPU count, capped at
# 16 (without vhost the default is a single queue pair); raising this
# above 16 widens what a caller may request without moving that default, and
# lowering it below 16 lowers the default too.
max_net_queues = 16
use_mrconfigid = true

# QEMU flags
#qemu_single_pass_add_pages = false
#qemu_pic = true
#qemu_version = ""
qemu_pci_hole64_size = 0
qemu_hotplug_off = false
# TDX attestation/hash scheme policy:
# - "legacy": digest.txt + legacy verifier
# - "lite": digest.txt + measurement.tdx.cbor + no-QEMU verifier
# - "auto": legacy for CVM memory below 3 GiB except exactly 2 GiB; otherwise
#   lite when the image supports it, legacy when it does not.
tdx_attestation_variant = "auto"

host_share_mode = "9p"

# QGS (Quote Generation Service) vsock port for kernel-level TSM support.
# When set, QEMU will pass this port to tdx-guest for configfs-tsm quote generation.
# The guest kernel will use this vsock port to communicate with the host QGS.
# Default is None (disabled), common value is 4050.
qgs_port = 4050

# SMBIOS product information for cloud environment detection.
# Field names correspond to /sys/class/dmi/id/ entries in guest.
[cvm.product]
## type=0 (BIOS Information)
# bios_vendor = ""
# bios_version = ""
# bios_date = ""
# bios_release = ""

## type=1 (System Information)
sys_vendor = "dstack"
product_name = "dstack"
# product_version = ""
# product_serial = ""
# product_uuid = ""
# product_family = ""
# product_sku = ""

## type=2 (Baseboard Information)
# board_vendor = "dstack"
# board_name = "dstack"
# board_version = ""
# board_serial = ""
# board_asset_tag = ""

# type=3 (Chassis Information)
# chassis_vendor = ""
# chassis_version = ""
# chassis_serial = ""
# chassis_asset_tag = ""

[cvm.networking]
mode = "user"

# Kernel vhost-net data plane. Off by default: enabling it changes the
# virtio-net device of every bridge/macvtap VM on its next boot (vhost plus
# vCPU-scaled queue pairs) and requires /dev/vhost-net to be accessible to
# the account QEMU runs under — verify that first, or QEMU exits at launch.
# With it off, QEMU drains every packet on its single main loop thread, so a
# CVM cannot exceed one core's worth of packet processing no matter how many
# vCPUs it has. The user-mode backend has no vhost support and ignores this.
# Individual VMs may override it.
vhost = false

# for mode = "user"
net = "10.0.2.0/24"
dhcp_start = "10.0.2.10"
restrict = false

# for mode = "bridge"
# bridge = "virbr0"

# Optional filtering for bridge interfaces only. It does not apply to macvtap.
# "none" installs no nwfilter binding. It does not remove the netd dependency:
# netd builds every bridge and macvtap host interface whatever this says.
[cvm.network_filter]
mode = "none"
filter = "clean-traffic"
parameters = {}

# Shared privileged networking service. Required by bridge and macvtap
# networking: it builds every host interface those modes use, binds their
# nwfilters, and arbitrates host ports between VMM instances. User mode and a
# caller-supplied netdev need nothing from it. Socket filesystem permissions
# authorize clients.
[netd]
socket = "/run/dstack/netd.sock"
# How often the VMM asks netd to collect interfaces no VM of its claims. The
# pass at startup is not optional and does not read this: it is the one moment
# the VMM knows every VM it has and everything a crash left behind is still
# there. This is the backstop for what accumulates while it runs. 0 disables it.
reconcile_interval_secs = 3600
# Whether a collection may delete interfaces carrying no ownership record. An
# unattributed interface is not nobody's: where two VMM instances share one
# netd it may be the other one's running VM, and before netd recorded ownership
# every interface looked like this. Turn it on only on a node with a single VMM
# instance, where nothing else creates interfaces in netd's name space.
collect_unattributed = false
# Applied when netd creates the socket itself. A systemd socket unit controls
# its own SocketMode instead.
socket_mode = 0o660
libvirt_uri = "qemu:///system"
# The bridge filtering policy netd enforces and applies: whether a binding is
# required, which nwfilter it names, and with what parameters. netd holds this
# itself rather than taking it from each request, because a caller that chose
# the filter could name one that drops nothing and still satisfy a policy that
# only asked for "some filter". Left unset it follows [cvm.network_filter] in
# this same file, which is the whole answer when netd and the VMM share one
# vmm.toml. Set it explicitly when netd runs with a config that has no [cvm]
# section, so the daemon holding the privilege never infers policy from a file
# that does not state it.
#[netd.network_filter]
#mode = "libvirt"
#filter = "clean-traffic"
#parameters = {}

[cvm.port_mapping]
enabled = false
address = "127.0.0.1"
range = [
    { protocol = "tcp", from = 1, to = 20000 },
]

[cvm.auto_restart]
enabled = true
interval = 20
max_retries = 5
initial_backoff = 5
max_backoff = 300
reset_window = 300

# Retention for the logs a CVM writes into its work directory. Currently
# governs serial.log: QEMU appends to it for the whole life of a boot, so
# without a cap a chatty guest can fill the host disk.
[cvm.log]
# Past this size the log is rotated to serial.log.1 and truncated in place.
# 0 disables rotation. Sizes take a single-letter suffix: "4M", "512K", "1G".
max_bytes = "4M"
# Rotated segments to keep; the oldest is discarded. A VM start rotates too,
# so this is also how many previous boots stay on disk.
max_backups = 3
# How often a live log is checked against max_bytes.
check_interval_secs = 5

[cvm.gpu]
enabled = false
# The product IDs of the GPUs to discover
# H200: 10de:2335
listing = ["10de:2335"]
# The PCI addresses of the cards to exclude
exclude = []
# The PCI addresses of the cards to include
include = []
# Allow attach all GPUs
allow_attach_all = true
# Issue a Secondary Bus Reset on each GPU's dedicated upstream PCIe bridge
# immediately before QEMU attaches the device. This clears stale GPU FSP/SPDM
# state left by a VM that terminated during GPU firmware initialization.
sanitize_on_attach = true
# Maximum time for all reset GPUs to become continuously VFIO-ready.
sbr_timeout_ms = 10000

[gateway]
base_domain = "localhost"
port = 8082
agent_port = 8090

[auth]
enabled = false
tokens = []
# Optional Apache htpasswd file for HTTP Basic authentication.
htpasswd_file = ""

[supervisor]
exe = "./supervisor"
sock = "./run/supervisor.sock"
pid_file = "./run/supervisor.pid"
log_file = "./run/supervisor.log"
detached = false
auto_start = true

[host_api]
ident = "dstack VMM"
address = "vsock:2"
port = 10000

[key_provider]
enabled = true
address = "127.0.0.1"
port = 3443
