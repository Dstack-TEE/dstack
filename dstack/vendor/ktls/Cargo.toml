# Vendored copy of ktls 6.0.2 -- see ../README.md for why and when to drop it.
#
# Transcribed from the crates.io package manifest. Two deliberate differences:
# the dev-dependencies are dropped (upstream's test suite is not run here and
# would pull rcgen, test-case and friends into this workspace's lock file), and
# the version carries a `+dstack` build metadata suffix so a stray crates.io
# resolution is impossible to confuse with this copy.
[package]
name = "ktls"
version = "6.0.2"
edition = "2021"
rust-version = "1.75"
authors = ["Amos Wenger <amos@bearcove.net>"]
description = "Configures kTLS for tokio-rustls client and server connections."
documentation = "https://docs.rs/ktls"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustls/ktls"
publish = false

[dependencies]
futures-util = "0.3.30"
ktls-sys = "1.0.1"
libc = { version = "0.2.155", features = ["const-extern-fn"] }
memoffset = "0.9.1"
nix = { version = "0.29.0", features = ["socket", "uio", "net"] }
num_enum = "0.7.3"
pin-project-lite = "0.2.14"
rustls = { version = "0.23.12", default-features = false }
smallvec = "1.13.2"
thiserror = "1.0.63"
tokio = { version = "1.39.2", features = ["net", "macros", "io-util"] }
tokio-rustls = { version = "0.26.0", default-features = false }
tracing = "0.1.40"

[features]
default = ["aws_lc_rs", "tls12"]
aws-lc-rs = ["aws_lc_rs"]
aws_lc_rs = ["rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]
ring = ["rustls/ring", "tokio-rustls/ring"]
tls12 = ["rustls/tls12", "tokio-rustls/tls12"]
