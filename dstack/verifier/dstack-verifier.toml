# Server configuration
address = "0.0.0.0"
port = 8080

# Image cache directory for OS image verification
image_cache_dir = "/tmp/dstack-verifier/cache"

# Image download URL template (replace {OS_IMAGE_HASH} with actual hash)
image_download_url = "https://download.dstack.org/os-images/mr_{OS_IMAGE_HASH}.tar.gz"

# Image download timeout in seconds
image_download_timeout_secs = 300

[attestation]
insecure_allow_external_trust_anchors = false

[attestation.urls]
# Each accepts a single URL or a list of interchangeable ones. With a list,
# endpoints are tried in order and the first answer wins, so put the endpoint
# you would rather load first. Failing over changes nothing about verification:
# collateral is vendor-signed and checked against roots built into the binary,
# so an endpoint can be slow, stale or absent but cannot be forged.
# pccs = "https://pccs.phala.network"
# pccs = ["https://pccs.internal", "https://pccs.phala.network"]
# amd_kds = "https://kdsintf.amd.com/vcek/v1"
# amd_kds = ["https://kds-cache.internal/vcek/v1", "https://kdsintf.amd.com/vcek/v1"]

[attestation.root_ca]
# tdx = "/etc/dstack/roots/intel-sgx-root-ca.der"
# gcp_tpm = "/etc/dstack/roots/gcp-tpm-root-ca.pem"
# aws_nitro_enclave = "/etc/dstack/roots/aws-nitro-enclave-root-ca.pem"
# aws_nitro_tpm = "/etc/dstack/roots/aws-nitro-tpm-root-ca.pem"
# sev_snp_milan = "/etc/dstack/roots/amd-milan-ark.pem"
# sev_snp_genoa = "/etc/dstack/roots/amd-genoa-ark.pem"
# sev_snp_turin = "/etc/dstack/roots/amd-turin-ark.pem"
