# Listeners. `[listeners.default]` applies to every listener unless the
# listener's own section overrides it; it also takes Rocket settings such as
# `workers` or `keep_alive`. The KMS refuses the older locations of these
# settings (`[rpc]`, `[core.admin]`, `[core.onboard]`, `[default]`).
[listeners.default]
# Sent as the `Server` header.
ident = "DStack KMS"
# Require a PROXY protocol (v1 or v2) header on every connection and log its
# source address as the client. Enable only behind a proxy that sends one, such
# as HAProxy with `send-proxy-v2`; connections without it are dropped. Not
# supported on the onboard listener.
proxy_protocol = false

# No `mutual` section: client certificates are verified by the attestation they
# carry, not by an issuer CA (see ra-rpc's ratls_client_verifier).
[listeners.default.tls]
key = "/var/lib/kms/certs/rpc.key"
certs = "/var/lib/kms/certs/rpc.crt"

# For CVMs: all KMS RPCs, including those that release keys.
[listeners.guest]
address = "0.0.0.0"
port = 8000

# Operator RPCs (e.g. ClearImageCache) and the key handover to onboarding KMS
# nodes, behind the admin credential below. It fails closed: the KMS does not
# start until auth_token (or DSTACK_KMS_ADMIN_TOKEN), auth_token_hash or
# htpasswd_file is set. Unless core.onboard.public_key_handover = true, the KMS
# requires this listener with TLS, so that other KMS nodes can onboard. Keep it
# off the public network; to serve KMS onboarding, bind to an address the new
# KMS can reach.
[listeners.admin]
enabled = true
address = "127.0.0.1"
port = 8001
# Shared admin token required by every admin RPC. Can also be supplied via the
# `DSTACK_KMS_ADMIN_TOKEN` or `ADMIN_API_TOKEN` env vars. Clients send it as
# `Authorization: Bearer <token>` or the `X-Admin-Token: <token>` header.
# Required unless insecure_no_auth = true. Generate with: openssl rand -hex 32
auth_token = ""
# Or the token's hex SHA-256, for a config that is not secret (an app compose).
# The hash is public there, so the token must be high-entropy random, or it can
# be brute-forced offline: TOKEN=$(openssl rand -hex 32)
# printf '%s' "$TOKEN" | sha256sum
auth_token_hash = ""
# Optional Apache bcrypt htpasswd file (create with `htpasswd -B -c file admin`).
htpasswd_file = ""
# Development/testing escape hatch only. Never enable this on an admin
# interface that is reachable from the network.
insecure_no_auth = false

# For deployers and verifiers: only the read-only RPCs (GetMeta,
# GetAppEnvEncryptPubKey, GetSealedEnvPubKey) at the same paths, so the guest
# listener can be restricted to the CVMs.
[listeners.public]
enabled = false
address = "0.0.0.0"
port = 8002

# The setup page, while [core.onboard] enabled = true and the KMS has no keys.
# Plain HTTP: it does not inherit the default `tls`.
[listeners.onboard]
address = "0.0.0.0"
port = 8000

[core]
cert_dir = "/var/lib/kms/certs"
# Root keys of every epoch, the only state the KMS cannot regenerate. Keep it on
# persistent storage.
keyring_dir = "/var/lib/kms/keyring"
subject_postfix = ".dstack"
site_name = ""
# Whether trusted RPCs require the KMS to first attest itself to its own
# auth API. Defaults to true (strict). Set to false ONLY when running KMS
# outside a TEE (e.g. local dev/testing) where the local guest agent socket
# is unavailable.
enforce_self_authorization = true
# Whether the KMS embeds an attestation in its own RPC certificate. Set false
# only for local dev/testing where the KMS runs outside a TEE. This narrows what
# the KMS asserts about itself and relaxes no verification: quotes presented to
# the KMS are still fully checked, and another KMS refuses to onboard from an
# unattested one.
attest_rpc_cert = true
# AMD SEV-SNP key/cert release remains disabled unless this local KMS gate is
# explicitly enabled. External auth policy must still allow the verified
# BootInfo before any sensitive material is returned.
sev_snp_key_release = false

# AWS EC2 NitroTPM key/cert release remains disabled unless this local KMS gate
# is explicitly enabled. NitroTPM is a new, non-confidential-compute attestation
# mode (the AWS hypervisor is in the TCB), so it is opt-in like SEV-SNP. External
# auth policy must still allow the verified BootInfo. NitroTPM has no TCB status,
# so the verifier reports "UpToDate" and requireTcbUpToDate does not gate it.
aws_nitro_tpm_key_release = false

# AWS Nitro Enclave key/cert release remains disabled unless this local KMS gate
# is explicitly enabled. The signed NSM document measures the enclave image, but
# the AWS hypervisor is in the TCB and dstack extends no runtime measurement
# register on this platform, so app_id and instance_id are read from an event
# list nothing replays against hardware. Opt-in like SEV-SNP and NitroTPM.
# External auth policy must still allow the verified BootInfo.
nitro_enclave_key_release = false

# Optional attestation trust-anchor files. Omitted entries use vendor roots.
[core.attestation]
insecure_allow_external_trust_anchors = false
# Hosts the GCP TPM AK issuer certificates and CRLs may be fetched from; `*`
# matches within one DNS label. Unset keeps Google's Private CA hosts.
# allowed_collateral_hosts = ["privateca-content-*.storage.googleapis.com"]

[core.attestation.urls]
# pccs = "https://pccs.phala.network"
# amd_kds = "https://kdsintf.amd.com/vcek/v1"

[core.attestation.root_ca]
# tdx = "/etc/dstack/roots/intel-sgx-root-ca.der"
# gcp_tpm = "/etc/dstack/roots/gcp-tpm-root-ca.pem"
# aws_nitro_enclave = "/etc/dstack/roots/aws-nitro-enclave-root-ca.pem"
# aws_nitro_tpm = "/etc/dstack/roots/aws-nitro-tpm-root-ca.pem"
# sev_snp_milan = "/etc/dstack/roots/amd-milan-ark.pem"
# sev_snp_genoa = "/etc/dstack/roots/amd-genoa-ark.pem"
# sev_snp_turin = "/etc/dstack/roots/amd-turin-ark.pem"

[core.image]
cache_dir = "/usr/share/dstack/images"
download_url = "http://localhost:8000/{OS_IMAGE_HASH}.tar.gz"
download_timeout = "2m"

[core.metrics]
# Expose unauthenticated Prometheus metrics on /metrics.
# Disable this if the rpc listener is not protected by network policy
# or another access-control layer.
enabled = true

[core.auth_api]
type = "webhook"

[core.auth_api.webhook]
url = "http://auth-api:8000"
# Per-call timeout; GetMeta reaches the auth API without a client certificate.
timeout = "60s"

[core.auth_api.dev]
gateway_app_id = "any"

[core.onboard]
enabled = true
auto_bootstrap_domain = ""
# Also serve KMS.GetKmsKey on the public RPC listener, for onboarding clients
# that cannot reach the admin listener (KMS 0.5.x, or no source admin token).
public_key_handover = false
