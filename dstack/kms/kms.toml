[default]
workers = 8
max_blocking = 64
ident = "DStack KMS"
temp_dir = "/tmp"
keep_alive = 10
log_level = "info"

[rpc]
address = "0.0.0.0"
port = 8000

[rpc.tls]
key = "/etc/kms/certs/rpc.key"
certs = "/etc/kms/certs/rpc.crt"

[rpc.tls.mutual]
ca_certs = "/etc/kms/certs/tmp-ca.crt"
mandatory = false

[core]
cert_dir = "/etc/kms/certs"
subject_postfix = ".dstack"
site_name = ""
# Whether trusted RPCs require the KMS to first attest itself to its own
# auth API. Defaults to true (strict). Set to false ONLY when running KMS
# outside a TEE (e.g. local dev/testing) where the local guest agent socket
# is unavailable.
enforce_self_authorization = true
# Optional AMD KDS-compatible base URL for SEV-SNP collateral fetches.
# Leave empty to use the built-in default.
amd_kds_base_url = ""

# AMD SEV-SNP key/cert release remains disabled unless this local KMS gate is
# explicitly enabled. External auth policy must still allow the verified
# BootInfo before any sensitive material is returned.
sev_snp_key_release = false

# AWS EC2 NitroTPM key/cert release remains disabled unless this local KMS gate
# is explicitly enabled. NitroTPM is a new, non-confidential-compute attestation
# mode (the AWS hypervisor is in the TCB), so it is opt-in like SEV-SNP. External
# auth policy must still allow the verified BootInfo.
aws_nitro_tpm_key_release = false

[core.image]
verify = true
cache_dir = "/usr/share/dstack/images"
download_url = "http://localhost:8000/{OS_IMAGE_HASH}.tar.gz"
download_timeout = "2m"

# Admin API: serves operator RPCs (e.g. ClearImageCache) on a dedicated
# listener behind the shared HTTP authenticator. Disabled by default; when
# enabled it fails closed unless auth_token or htpasswd_file is set.
[core.admin]
enabled = false
# Bind address/port for the admin listener (keep it off the public network).
address = "127.0.0.1"
port = 8001
# Shared admin token required by every admin RPC. Can also be supplied via the
# `DSTACK_KMS_ADMIN_TOKEN` or `ADMIN_API_TOKEN` env vars. Clients send it as
# `Authorization: Bearer <token>` or the `X-Admin-Token: <token>` header.
# Required unless insecure_no_auth = true. Generate with: openssl rand -hex 32
auth_token = ""
# Optional Apache bcrypt htpasswd file (create with `htpasswd -B -c file admin`).
htpasswd_file = ""
# Development/testing escape hatch only. Never enable this on an admin
# interface that is reachable from the network.
insecure_no_auth = false

[core.metrics]
# Expose unauthenticated Prometheus metrics on /metrics.
# Disable this if the KMS RPC listener is not protected by network policy
# or another access-control layer.
enabled = true

[core.auth_api]
type = "webhook"

[core.auth_api.webhook]
url = "http://auth-api:8000"

[core.auth_api.dev]
gateway_app_id = "any"

[core.onboard]
enabled = true
auto_bootstrap_domain = ""
address = "0.0.0.0"
port = 8000
