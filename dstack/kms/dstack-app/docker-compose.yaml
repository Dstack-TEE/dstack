services:
  # Helios is a Ethereum light client
  helios:
    build:
      context: .
      dockerfile_inline: |
        FROM rust:1.92.0@sha256:48851a839d6a67370c9dbe0e709bedc138e3e404b161c5233aedcf2b717366e4
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/* build-base openssl-dev protobuf protobuf-dev perl
        RUN git clone https://github.com/a16z/helios && \
            cd helios && \
            git checkout 5c61864a167c16141a9a12b976c0e9398b332f07
        WORKDIR /app/helios
        RUN cargo build --release
    command: [
      "./target/release/helios",
      "ethereum",
      "--network", "mainnet",
      "--checkpoint", "0xbee4f32f91e62060d2aa41c652f6c69431829cfb09b02ea3cad92f65bd15dcce",
      "--rpc-bind-ip", "0.0.0.0",
      "--rpc-port", "8545",
      "--consensus-rpc", "https://ethereum.operationsolarstorm.org",
      "--execution-rpc", "https://ethereum-rpc.publicnode.com"
    ]

  # Auth API is a webhook server that authenticates KMS instances and Apps launches (Ethereum)
  auth-api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
        WORKDIR /app

        RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
        RUN git clone https://github.com/Dstack-TEE/dstack.git && \
            cd dstack && \
            git checkout 78057c975fe4b9e21f557fb888d72eeecfb21178
        WORKDIR /app/dstack/kms/auth-eth
        RUN npm ci && npm run build
        CMD node dist/main.js
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ETH_RPC_URL=http://helios:8545
      - KMS_CONTRACT_ADDR=0x515cd0dd984Adc75EE8625131FcC3d2D91f7F140
    depends_on:
      - helios

  # Auth NEAR is a webhook server that authenticates KMS instances and Apps launches (NEAR Protocol)
  auth-near:
    build:
      context: .
      dockerfile_inline: |
        FROM oven/bun:1.1.0-alpine
        WORKDIR /app

        RUN apk add --no-cache git
        RUN git clone https://github.com/Dstack-TEE/dstack.git && \
            cd dstack && \
            git checkout 78057c975fe4b9e21f557fb888d72eeecfb21178
        WORKDIR /app/dstack/kms/auth-near
        RUN bun install
        CMD bun run index.ts
    environment:
      - PORT=3000
      - NEAR_RPC_URL=${NEAR_RPC_URL:-https://free.rpc.fastnear.com}
      - NEAR_NETWORK_ID=${NEAR_NETWORK_ID:-mainnet}
      - KMS_CONTRACT_ID=${KMS_CONTRACT_ID}
    ports:
      - 3000:3000

  # KMS handles the TEE Remote Attestation
  kms:
    build:
      context: .
      dockerfile_inline: |
        FROM rust:1.92.0@sha256:48851a839d6a67370c9dbe0e709bedc138e3e404b161c5233aedcf2b717366e4
        WORKDIR /app
        RUN apt-get update && apt-get install -y \
            git \
            build-essential \
            libssl-dev \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev \
            --no-install-recommends \
            && rm -rf /var/lib/apt/lists/*
        RUN git clone https://github.com/Dstack-TEE/dstack.git && \
            cd dstack && \
            git checkout 78057c975fe4b9e21f557fb888d72eeecfb21178
        WORKDIR /app/dstack
        RUN cargo build --release --locked -p dstack-kms
        CMD ["./target/release/dstack-kms"]
    volumes:
      - kms-volume:/etc/kms
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - 8000:8000
    depends_on:
      - auth-api

volumes:
  kms-volume:
