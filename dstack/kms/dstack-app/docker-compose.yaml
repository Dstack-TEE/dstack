services:
  relay:
    image: ${KMS_IMAGE:?Set a published KMS image digest}
    restart: unless-stopped
    command:
      - opstack-server
      - --network=phala
      - --execution-rpc=https://rpc.phala.network
      - --server-address=0.0.0.0:3000
      - --gossip-address=0.0.0.0:9876
    environment:
      OP_NODE_P2P_STATIC: /ip4/8.229.99.126/tcp/9222/p2p/16Uiu2HAmA7EmxHixJhunY6dZKi7nriyUfBCWP3aBPvGUsQBbigm1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  helios:
    image: ${KMS_IMAGE:?Set a published KMS image digest}
    restart: unless-stopped
    command:
      - helios
      - opstack
      - --network=phala
      - --execution-rpc=https://rpc.phala.network
      - --consensus-rpc=http://relay:3000
      - --rpc-bind-ip=0.0.0.0
      - --rpc-port=8545
    depends_on: [relay]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  auth-api:
    image: ${KMS_IMAGE:?Set a published KMS image digest}
    command: [node, /opt/auth-eth/dist/main.js]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      ETH_RPC_URL: http://helios:8545
      ETH_CHAIN_ID: "2035"
      ETH_BLOCK_LAG: "2"
      ETH_MAX_BLOCK_AGE_SECONDS: ${ETH_MAX_BLOCK_AGE_SECONDS:?Set the maximum accepted block age}
      KMS_CONTRACT_ADDR: ${KMS_CONTRACT_ADDR:?Set the Phala KMS contract address}
    depends_on: [helios]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  kms:
    image: ${KMS_IMAGE:?Set a published KMS image digest}
    volumes:
      - kms-volume:/kms
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - 8000:8000
    depends_on:
      - auth-api
    restart: unless-stopped
    configs:
      - source: kms_config
        target: /kms/kms.toml
    command: sh -c 'mkdir -p /kms/certs /kms/images && exec dstack-kms -c /kms/kms.toml'

volumes:
  kms-volume:

configs:
  kms_config:
    content: |
      [rpc]
      address = "0.0.0.0"
      port = 8000

      [rpc.tls]
      key = "/kms/certs/rpc.key"
      certs = "/kms/certs/rpc.crt"

      [core]
      cert_dir = "/kms/certs"

      [core.image]
      verify = true
      cache_dir = "/kms/images"
      download_url = "${IMAGE_DOWNLOAD_URL}"
      download_timeout = "2m"

      [core.auth_api]
      type = "webhook"

      [core.auth_api.webhook]
      url = "http://auth-api:8000"

      [core.onboard]
      enabled = true
      auto_bootstrap_domain = ""
      address = "0.0.0.0"
      port = 8000
