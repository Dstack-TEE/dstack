services:
  relay:
    image: dstack-phala-light-client:local
    build: ../light-client
    restart: unless-stopped
    command:
      - opstack-server
      - --network=phala
      - --execution-rpc=https://rpc.phala.network
      - --server-address=0.0.0.0:3000
      - --gossip-address=0.0.0.0:9876
    environment:
      OP_NODE_P2P_STATIC: /ip4/8.229.99.126/tcp/9222/p2p/16Uiu2HAmA7EmxHixJhunY6dZKi7nriyUfBCWP3aBPvGUsQBbigm1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  helios:
    image: dstack-phala-light-client:local
    restart: unless-stopped
    command:
      - helios
      - opstack
      - --network=phala
      - --execution-rpc=https://rpc.phala.network
      - --consensus-rpc=http://relay:3000
      - --rpc-bind-ip=0.0.0.0
      - --rpc-port=8545
    depends_on: [relay]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  auth-api:
    build:
      context: ../auth-eth
      dockerfile: ../light-client/auth-api.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      ETH_RPC_URL: http://helios:8545
      ETH_CHAIN_ID: "2035"
      ETH_BLOCK_LAG: "2"
      ETH_MAX_BLOCK_AGE_SECONDS: "60"
      KMS_CONTRACT_ADDR: ${KMS_CONTRACT_ADDR:?Set the Phala KMS contract address}
    depends_on: [helios]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # KMS handles the TEE Remote Attestation
  kms:
    build:
      context: .
      dockerfile_inline: |
        FROM rust:1.92.0@sha256:48851a839d6a67370c9dbe0e709bedc138e3e404b161c5233aedcf2b717366e4
        WORKDIR /app
        RUN apt-get update && apt-get install -y \
            git \
            build-essential \
            libssl-dev \
            protobuf-compiler \
            libprotobuf-dev \
            clang \
            libclang-dev \
            --no-install-recommends \
            && rm -rf /var/lib/apt/lists/*
        RUN git clone https://github.com/Dstack-TEE/dstack.git && \
            cd dstack && \
            git checkout 78057c975fe4b9e21f557fb888d72eeecfb21178
        WORKDIR /app/dstack
        RUN cargo build --release -p dstack-kms
        CMD ["./target/release/dstack-kms"]
    volumes:
      - kms-volume:/etc/kms
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - 8000:8000
    depends_on:
      - auth-api

volumes:
  kms-volume:
