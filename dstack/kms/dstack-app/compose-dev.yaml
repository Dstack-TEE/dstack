services:
  auth-api:
    build:
      context: .
      dockerfile_inline: |
        FROM oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
        WORKDIR /app

        RUN apk add --no-cache git ca-certificates
        RUN git clone ${GIT_REPOSITORY} && \
            cd dstack && \
            git checkout ${GIT_REV}
        WORKDIR /app/dstack/dstack/kms/auth-eth-bun
        RUN bun install --frozen-lockfile --production --ignore-scripts
        ENV NODE_ENV=production
        CMD ["bun", "index.ts"]
    environment:
      - PORT=8000
      - ETH_RPC_URL=${ETH_RPC_URL}
      # finalized on L1; an OP-stack chain read through Helios requires latest.
      - ETH_BLOCK_TAG=${ETH_BLOCK_TAG}
      - ETH_FINALITY_CONFIRMATIONS=${ETH_FINALITY_CONFIRMATIONS}
      # Empty disables the chain ID check.
      - ETH_CHAIN_ID=${ETH_CHAIN_ID}
      - KMS_CONTRACT_ADDR=${KMS_CONTRACT_ADDR}
    restart: unless-stopped
    ports:
      - 8001:8000

  kms:
    image: ${KMS_IMAGE}
    volumes:
      - kms-volume:/kms
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - 8000:8000
    depends_on:
      - auth-api
    restart: unless-stopped
    configs:
      - source: kms_config
        target: /kms/kms.toml
    command: sh -c 'mkdir -p /kms/certs /kms/images && exec dstack-kms -c /kms/kms.toml'

volumes:
  kms-volume:

configs:
  kms_config:
    content: |
      [rpc]
      address = "0.0.0.0"
      port = 8000

      [rpc.tls]
      key = "/kms/certs/rpc.key"
      certs = "/kms/certs/rpc.crt"

      [core]
      cert_dir = "/kms/certs"

      [core.image]
      cache_dir = "/kms/images"
      download_url = "${IMAGE_DOWNLOAD_URL}"
      download_timeout = "2m"

      [core.auth_api]
      type = "webhook"

      [core.auth_api.webhook]
      url = "http://auth-api:8000"

      [core.onboard]
      enabled = true
      auto_bootstrap_domain = ""
      address = "0.0.0.0"
      port = 8000
