# KMS deployment with an external dstack-auth webhook.
# dstack-auth runs outside the CVM, on the operator host; see
# docs/dstack-auth-operations.md.

services:
  kms:
    image: ${KMS_IMAGE}
    volumes:
      - kms-volume:/kms
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - 8000:8000
      - 8002:8001
    restart: unless-stopped
    configs:
      - source: kms_config
        target: /kms/kms.toml
    command: sh -c 'mkdir -p /kms/certs /kms/images && exec dstack-kms -c /kms/kms.toml'

volumes:
  kms-volume:

configs:
  kms_config:
    content: |
      [rpc]
      address = "0.0.0.0"
      port = 8000

      [rpc.tls]
      key = "/kms/certs/rpc.key"
      certs = "/kms/certs/rpc.crt"

      [core]
      cert_dir = "/kms/certs"

      [core.image]
      cache_dir = "/kms/images"
      download_url = "${IMAGE_DOWNLOAD_URL}"
      download_timeout = "2m"

      [core.auth_api]
      type = "webhook"

      [core.auth_api.webhook]
      url = "${AUTH_WEBHOOK_URL}"

      [core.admin]
      enabled = true
      # The onboarding KMS reaches it through the CVM port 8002.
      address = "0.0.0.0"
      port = 8001
      # SHA-256 of the admin token, which stays with the operator.
      auth_token_hash = "${ADMIN_TOKEN_HASH}"

      [core.admin.tls]
      key = "/kms/certs/rpc.key"
      certs = "/kms/certs/rpc.crt"

      [core.onboard]
      enabled = true
      auto_bootstrap_domain = ""
      address = "0.0.0.0"
      port = 8000
