# Shared attestation fixture for the gateway test suites.
#
# The guest agent simulator signs its quotes under trust anchors derived from
# `mock_attestation_seed`, and the collateral service reconstructs the matching
# public roots from the same seed. The two are only useful together and only
# while the seed matches, so they live in one file that every suite includes
# rather than being copied per suite, where they would drift apart and leave
# every peer quote failing to verify for no visible reason.
#
# Deliberately network-agnostic: an including file attaches these services to
# its own network. Compose merges that in while keeping what is defined here.

services:
  dstack-simulator:
    networks: [attestation]
    build:
      context: ../../../..
      dockerfile: dstack/gateway/test-run/attestation/Dockerfile.simulator
    image: dstack-simulator:gateway-e2e
    volumes:
      - dstack-socket:/var/run/dstack
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/dstack/dstack.sock"]
      interval: 1s
      timeout: 1s
      retries: 30

  mock-attestation:
    networks: [attestation]
    build:
      context: ../../../..
      dockerfile: dstack/gateway/test-run/attestation/Dockerfile.mock-attestation
    image: dstack-mock-attestation:gateway-e2e
    # No container_name on purpose. A fixed one is global, so pinning it here
    # would stop two suites -- which all include this file -- from being up at
    # the same time. Compose still publishes `mock-attestation` as a network
    # alias, so everything addressing it by name keeps working.
    command:
      - serve
      - --listen
      - 0.0.0.0:8088
      - --config
      - /etc/dstack/tee-simulator.json
      - --output
      - /roots
    volumes:
      - attestation-roots:/roots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/tpm/aia/root.pem"]
      interval: 1s
      timeout: 2s
      retries: 30

# Named explicitly. A per-test project has to reference these from outside, and
# compose's default `<project>_<name>` would make that a guess about which
# project happened to create them first.
networks:
  attestation:
    name: dstack-attestation

volumes:
  dstack-socket:
    name: dstack-attestation-socket
  attestation-roots:
    name: dstack-attestation-roots
