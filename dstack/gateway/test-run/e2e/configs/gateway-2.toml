# Gateway Node 2 configuration for E2E testing
log_level = "debug"
address = "0.0.0.0"
port = 9012

[tls]
key = "/var/lib/gateway/certs/gateway-rpc.key"
certs = "/var/lib/gateway/certs/gateway-rpc.cert"

[tls.mutual]
ca_certs = "/var/lib/gateway/certs/gateway-ca.cert"
mandatory = false

[core]
rpc_domain = "gateway-2"

[core.admin]
enabled = true
port = 9016
address = "0.0.0.0"
# TEST ONLY - do not use in production; weak/hardcoded credential
auth_token = "e2e-admin-token"

[core.debug]
# TEST ONLY - do not use in production; enables debug RPC
insecure_enable_debug_rpc = true
port = 9015
address = "0.0.0.0"

# Verify peer quotes against the development roots the mock collateral service
# derives from the simulator's seed. Verification itself runs the normal
# production path -- this only says the anchor may come from outside the vendor
# set, which is what makes attestation testable off TDX hardware. It does not
# switch any check off; there is no longer a switch that does.
[core.attestation]
insecure_allow_external_trust_anchors = true

[core.attestation.urls]
pccs = "http://mock-attestation:8088"

[core.attestation.root_ca]
tdx = "/var/lib/attestation/tdx-root-ca.pem"

[core.sync]
enabled = true
interval = "5s"
timeout = "10s"
my_url = "https://gateway-2:9012"
bootnode = "https://gateway-1:9012"
node_id = 2
data_dir = "/var/lib/gateway/wavekv"

[core.wg]
private_key = "SEcoI37oGWynhukxXo5Mi8/8zZBU6abg6T1TOJRMj1Y="
public_key = "xc+7qkdeNFfl4g4xirGGGXHMc0cABuE5IHaLeCASVWM="
listen_port = 9013
ip = "10.0.42.1/24"
reserved_net = ["10.0.42.1/31"]
client_ip_range = "10.0.42.1/24"
config_path = "/var/lib/gateway/wg.conf"
interface = "wg-test2"
endpoint = "gateway-2:9013"

[core.proxy]
listen_addr = "0.0.0.0"
listen_port = 9014
tappd_port = 8090
external_port = 9014
