# E2E test environment for dstack-gateway certbot functionality
# Uses mock services: Pebble (ACME) + mock-cf-dns-api (Cloudflare DNS)
# Uses a test-local dstack Guest Agent simulator for certificate and app identity flows.

# Same long-lived fixture project the cluster suite uses; run-e2e.sh brings it
# up. Referencing it rather than including it keeps one instance of the seed and
# the roots derived from it, and keeps this suite's network to itself.
networks:
  attestation:
    external: true
    name: ${FIXTURE_NS:?FIXTURE_NS must be set}

  certbot-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  dstack-socket:
    external: true
    name: ${FIXTURE_NS:?FIXTURE_NS must be set}-socket
  attestation-roots:
    external: true
    name: ${FIXTURE_NS:?FIXTURE_NS must be set}-roots

services:
  # ==================== Mock Services ====================

  # Mock Cloudflare DNS API. Built from the repo rather than pulled, and the
  # same image the full-stack suite builds, so both suites answer DNS the same
  # way and neither depends on a prebuilt image nobody can rebuild.
  # Source: tools/mock-cf-dns.
  mock-cf-dns-api:
    build:
      context: ../../../../tools/mock-cf-dns
    image: dstack-e2e-mock-cf-dns:local
    container_name: mock-cf-dns-api
    networks:
      certbot-test:
        ipv4_address: 172.30.0.10
    ports:
      - "18080:8080"
    environment:
      - PORT=8080
      - DEBUG=true
      # The zones certbot writes into and Pebble reads back out of.
      - MOCK_CF_ZONES=test0.local,test1.local,test2.local,persist0.local,persist1.local,persist2.local,selfcheck0.local
      # Advertise this container as the authoritative nameserver for those
      # zones, so certbot's self-check can reach it the way it reaches a real
      # one -- NS for the zone, A for the answer -- instead of failing that
      # lookup and quietly falling back to its system resolver.
      - MOCK_CF_NS_ADDR=172.30.0.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Pebble - Let's Encrypt test server. Upstream plus a `-http` flag, so a
  # client in another container can reach it by service name without trusting
  # the Pebble root: github.com/kvinwang/pebble branch http-flag.
  pebble:
    image: kvin/pebble:v2.10.1-http
    container_name: pebble
    command: ["-http", "-dnsserver", "172.30.0.10:53"]
    networks:
      certbot-test:
        ipv4_address: 172.30.0.11
    ports:
      - "14000:14000"  # ACME directory
      - "15000:15000"  # Management interface
    environment:
      - PEBBLE_VA_NOSLEEP=1
      # No PEBBLE_VA_ALWAYS_VALID: the mock answers DNS over TCP, which is the
      # only transport Pebble uses once it is given -dnsserver, so challenges
      # are validated against the records rather than waved through.
      #
      # CAA is not, and cannot be here: Pebble only advertises `caaIdentities`
      # in its directory metadata and never queries CAA, so no CAA record in
      # this harness can permit or forbid an order. Every CAA assertion below
      # is against the mock's record store -- what certbot wrote -- and none of
      # them is evidence that a CA would accept or refuse it.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14000/dir"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==================== Gateway Cluster ====================

  # Gateway Node 1 - Will be the first to request certificate
  gateway-1:
    image: ${GATEWAY_IMAGE:-dstack-gateway:test}
    container_name: gateway-1
    networks:
      attestation:
      certbot-test:
        ipv4_address: 172.30.0.21
    ports:
      - "19012:9012"  # RPC
      - "19014:9014"  # Proxy
      - "19015:9015"  # Debug
      - "19016:9016"  # Admin
    volumes:
      - ./configs/gateway-1.toml:/etc/gateway/gateway.toml:ro
      - dstack-socket:/var/run/dstack
      - attestation-roots:/var/lib/attestation:ro
    tmpfs:
      - /var/lib/gateway
    environment:
      - RUST_LOG=info,dstack_gateway=debug,certbot=debug
      - DSTACK_AGENT_ADDRESS=unix:/var/run/dstack/dstack.sock
    # The fixture is a separate project now; run-e2e.sh brings it up and waits
    # for it before this one starts, so it cannot be a depends_on here.
    depends_on:
      mock-cf-dns-api:
        condition: service_healthy
      pebble:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9015/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    # Resolve through the mock, which owns the test zones and forwards
    # everything else. certbot's pre-order self-check reads DNS like any
    # client; without this it queries a resolver that has never heard of the
    # challenge names, so the check can only ever time out.
    dns:
      - 172.30.0.10
    cap_add:
      - NET_ADMIN
    extra_hosts:
      # Pebble returns localhost in directory URLs, so we need to resolve localhost to pebble's IP
      - "localhost:172.30.0.11"

  # Gateway Node 2 - Will sync certificate from Node 1
  gateway-2:
    image: ${GATEWAY_IMAGE:-dstack-gateway:test}
    container_name: gateway-2
    networks:
      attestation:
      certbot-test:
        ipv4_address: 172.30.0.22
    ports:
      - "19022:9012"  # RPC
      - "19024:9014"  # Proxy
      - "19025:9015"  # Debug
      - "19026:9016"  # Admin
    volumes:
      - ./configs/gateway-2.toml:/etc/gateway/gateway.toml:ro
      - dstack-socket:/var/run/dstack
      - attestation-roots:/var/lib/attestation:ro
    tmpfs:
      - /var/lib/gateway
    environment:
      - RUST_LOG=info,dstack_gateway=debug,certbot=debug
      - DSTACK_AGENT_ADDRESS=unix:/var/run/dstack/dstack.sock
    depends_on:
      gateway-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9015/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    # Resolve through the mock, which owns the test zones and forwards
    # everything else. certbot's pre-order self-check reads DNS like any
    # client; without this it queries a resolver that has never heard of the
    # challenge names, so the check can only ever time out.
    dns:
      - 172.30.0.10
    cap_add:
      - NET_ADMIN

  # Gateway Node 3 - Will sync certificate from cluster
  gateway-3:
    image: ${GATEWAY_IMAGE:-dstack-gateway:test}
    container_name: gateway-3
    networks:
      attestation:
      certbot-test:
        ipv4_address: 172.30.0.23
    ports:
      - "19032:9012"  # RPC
      - "19034:9014"  # Proxy
      - "19035:9015"  # Debug
      - "19036:9016"  # Admin
    volumes:
      - ./configs/gateway-3.toml:/etc/gateway/gateway.toml:ro
      - dstack-socket:/var/run/dstack
      - attestation-roots:/var/lib/attestation:ro
    tmpfs:
      - /var/lib/gateway
    environment:
      - RUST_LOG=info,dstack_gateway=debug,certbot=debug
      - DSTACK_AGENT_ADDRESS=unix:/var/run/dstack/dstack.sock
    depends_on:
      gateway-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9015/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    # Resolve through the mock, which owns the test zones and forwards
    # everything else. certbot's pre-order self-check reads DNS like any
    # client; without this it queries a resolver that has never heard of the
    # challenge names, so the check can only ever time out.
    dns:
      - 172.30.0.10
    cap_add:
      - NET_ADMIN

  # ==================== Test Runner ====================

  test-runner:
    image: alpine:latest
    container_name: test-runner
    networks:
      certbot-test:
        ipv4_address: 172.30.0.100
    volumes:
      - ./test.sh:/test.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl openssl jq && /bin/sh /test.sh"]
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
      gateway-3:
        condition: service_healthy
