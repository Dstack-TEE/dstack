[package]
name = "dstack-gateway"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dstack-attest.workspace = true
arc-swap.workspace = true
rocket = { workspace = true, features = ["mtls", "json"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
ipnet = { workspace = true, features = ["serde"] }
fs-err.workspace = true
clap = { workspace = true, features = ["derive", "string"] }
shared_child.workspace = true
tokio = { workspace = true, features = ["full"] }
rustls.workspace = true
tokio-rustls = { workspace = true, features = ["ring"] }
rinja.workspace = true
hex.workspace = true
parcelona.workspace = true
hickory-resolver.workspace = true
pin-project.workspace = true
serde_json.workspace = true
rand.workspace = true
dstack-build-info.workspace = true
ra-rpc = { workspace = true, features = ["rocket"] }
dstack-gateway-rpc.workspace = true
certbot.workspace = true
bytes.workspace = true
safe-write.workspace = true
smallvec.workspace = true
futures.workspace = true
cmd_lib.workspace = true
load_config.workspace = true
ra-tls.workspace = true
dstack-guest-agent-rpc.workspace = true
http-client = { workspace = true, features = ["prpc"] }
sha2.workspace = true
dstack-types.workspace = true
serde-duration.workspace = true
reqwest = { workspace = true, features = ["json"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
hyper-rustls.workspace = true
http-body-util.workspace = true
x509-parser.workspace = true
jemallocator.workspace = true
proxy-protocol.workspace = true
wavekv.workspace = true
tdx-attest.workspace = true
flate2.workspace = true
uuid = { workspace = true, features = ["v4"] }
rmp-serde.workspace = true
or-panic.workspace = true
base64.workspace = true
dstack-api-auth.workspace = true
cached-cell.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource", "fs", "socket", "zerocopy"] }
ktls.workspace = true
libc.workspace = true
socket2.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
wavekv-v1 = { package = "wavekv", version = "=1.0.0" }
# `test-util` gives the idle-watchdog tests a paused clock, so they assert on
# the window without waiting for it in wall-clock time.
tokio = { workspace = true, features = ["test-util"] }
