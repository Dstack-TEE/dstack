x-common: &common-config
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "5"

services:
  aesmd:
    <<: *common-config
    container_name: aesmd
    build:
      context: ..
      dockerfile: build/Dockerfile.aesmd
    privileged: true
    devices:
      - "/dev/sgx_enclave:/dev/sgx_enclave"
      - "/dev/sgx_provision:/dev/sgx_provision"
    volumes:
      - "./sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf"
      - "aesmd:/var/run/aesmd/"
    network_mode: "host"

  local-key-provider:
    <<: *common-config
    container_name: local-key-provider
    build:
      context: ../..
      dockerfile: local-key-provider/build/Dockerfile.key-provider
      # These defaults select the base snapshot and toolchain. Always record
      # the mr_enclave printed by the completed build before pinning it.
      args:
        APT_SNAPSHOT: ${APT_SNAPSHOT:-20260423T000000Z}
        RUSTUP_VERSION: ${RUSTUP_VERSION:-1.28.2}
        RUSTUP_INIT_SHA256: ${RUSTUP_INIT_SHA256:-20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.92.0}
    privileged: true
    devices:
      - "/dev/sgx_enclave:/dev/sgx_enclave"
      - "/dev/sgx_provision:/dev/sgx_provision"
    depends_on:
      - aesmd
    environment:
      PCCS_URL: ${PCCS_URL:-https://pccs.phala.network}
      SEALING_PROVIDER_ADDR: 0.0.0.0:3443
    volumes:
      - "aesmd:/var/run/aesmd/"
    ports:
      - "127.0.0.1:${KEY_PROVIDER_PORT:-3443}:3443"

volumes:
  aesmd:
