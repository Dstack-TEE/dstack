[package]
name = "local-key-provider"
version = "0.1.0"
authors = ["Kevin Wang <wy721@qq.com>", "Leechael <Leechael@github.com>"]
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/Dstack-TEE/dstack"
repository = "https://github.com/Dstack-TEE/dstack"
description = "SGX-backed local sealing-key provider for dstack TDX guests"

[features]
dev-mode = []

[dependencies]
blake2 = "0.10.6"
dcap-qvl = "=0.5.2"
rand_core = "0.6.4"
salsa20 = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.46.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xsalsa20poly1305 = "0.9.0"
